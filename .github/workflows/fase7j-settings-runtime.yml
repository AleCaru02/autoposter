name: FASE 7J Settings Account Runtime
# Synced against current main for runtime verification.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fase7j-settings-runtime.yml"
      - "tests/fase7j-settings-*"
      - "tests/wrangler.fase7j-runtime.jsonc"

concurrency:
  group: fase7j-settings-runtime
  cancel-in-progress: false

jobs:
  runtime:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'verify/fase7j-settings-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - name: Product regression
        run: |
          npm run test:fase7j-settings-account
          npm run typecheck
          npm run build
      - name: Generate ephemeral verifier material
        shell: bash
        run: |
          set -euo pipefail
          marker="${GITHUB_RUN_ID}"
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          alias="settings7j-${GITHUB_RUN_ID}"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "SETTINGS7J_MARKER=$marker" >> "$GITHUB_ENV"
          echo "SETTINGS7J_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SETTINGS7J_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "SETTINGS7J_CONTROLLER_URL=https://${alias}-autoposter.02alessandrocaruso.workers.dev/" >> "$GITHUB_ENV"
          printf 'SETTINGS7J_TOKEN=%s\n' "$token" > .fase7j-runtime-secrets.env
          chmod 600 .fase7j-runtime-secrets.env
      - name: Upload isolated preview controller
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload --config tests/wrangler.fase7j-runtime.jsonc --keep-vars --preview-alias "settings7j-${GITHUB_RUN_ID}" --secrets-file .fase7j-runtime-secrets.env | tee fase7j-upload.log
          version_id=$(sed -n 's/^Worker Version ID: \([0-9a-fA-F-]*\)$/\1/p' fase7j-upload.log | tail -n 1)
          test -n "$version_id"
          echo "SETTINGS7J_CONTROLLER_VERSION=$version_id" >> "$GITHUB_ENV"
      - name: Verify isolation and clean preflight
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o fase7j-deployments-before.json
          node - <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('fase7j-deployments-before.json','utf8'));if(b?.success!==true)throw new Error('deployment read failed');const d=Array.isArray(b.result?.deployments)?b.result.deployments:b.result;const ids=d.map(x=>String(x.id||'')).filter(Boolean).sort();const versions=[...new Set(d.flatMap(x=>(x.versions||[]).map(v=>String(v.version_id||''))).filter(Boolean))].sort();if(versions.includes(process.env.SETTINGS7J_CONTROLLER_VERSION))throw new Error('preview attached to production');fs.appendFileSync(process.env.GITHUB_ENV,`SETTINGS7J_PROD_DEPLOYMENTS=${ids.join(',')}\nSETTINGS7J_PROD_VERSIONS=${versions.join(',')}\n`);
          NODE
          call_controller(){ curl -fsS -X POST -H 'content-type: application/json' -H "x-settings7j-token: $SETTINGS7J_TOKEN_VALUE" --data "{\"action\":\"$1\",\"marker\":\"$SETTINGS7J_MARKER\"}" "$SETTINGS7J_CONTROLLER_URL"; }
          call_controller preflight > fase7j-preflight.json
          stale=$(node -e "const b=require('./fase7j-preflight.json');process.stdout.write(String(b.recognizedQaUsers||0))")
          if [ "$stale" -gt 0 ]; then call_controller cleanup-residue > fase7j-stale-cleanup.json; call_controller preflight > fase7j-preflight.json; fi
          node - <<'NODE'
          const fs=require('node:fs');const b=require('./fase7j-preflight.json');for(const key of ['qaUsers','recognizedQaUsers','qaProfiles','qaEntitlements','qaUsage'])if(b[key]!==0)throw new Error(`preflight residue ${key}=${b[key]}`);if(b.jobsTotal!==0||b.snapshotsTotal!==0||b.targetsTotal!==0)throw new Error(`production baseline not empty ${JSON.stringify(b)}`);fs.appendFileSync(process.env.GITHUB_ENV,`SETTINGS7J_BASELINE_PROFILES=${b.profilesTotal}\nSETTINGS7J_BASELINE_JOBS=${b.jobsTotal}\nSETTINGS7J_BASELINE_SNAPSHOTS=${b.snapshotsTotal}\nSETTINGS7J_BASELINE_TARGETS=${b.targetsTotal}\nCONTROLLER_READY=true\n`);console.log('FASE7J_PREFLIGHT: PASS',JSON.stringify(b));
          NODE
      - name: Install browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Authenticated Settings desktop and mobile
        run: node tests/fase7j-settings-browser.mjs
      - name: Cleanup QA artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CONTROLLER_READY:-}" != "true" ]; then exit 0; fi
          status=$(curl -sS -o fase7j-cleanup.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-settings7j-token: $SETTINGS7J_TOKEN_VALUE" --data "{\"action\":\"cleanup\",\"marker\":\"$SETTINGS7J_MARKER\"}" "$SETTINGS7J_CONTROLLER_URL" || true)
          CLEANUP_STATUS="$status" node - <<'NODE'
          const b=require('./fase7j-cleanup.json');if(process.env.CLEANUP_STATUS!=='200'||b.cleaned!==true)throw new Error('cleanup failed');for(const key of ['qaUsers','recognizedQaUsers','qaProfiles','qaEntitlements','qaUsage'])if(b[key]!==0)throw new Error(`cleanup residue ${key}=${b[key]}`);for(const [key,env] of [['profilesTotal','SETTINGS7J_BASELINE_PROFILES'],['jobsTotal','SETTINGS7J_BASELINE_JOBS'],['snapshotsTotal','SETTINGS7J_BASELINE_SNAPSHOTS'],['targetsTotal','SETTINGS7J_BASELINE_TARGETS']])if(String(b[key])!==String(process.env[env]))throw new Error(`baseline mismatch ${key}`);console.log('FASE7J_CLEANUP: PASS',JSON.stringify(b));
          NODE
      - name: Post-cleanup deployment invariant
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --retry 4 --retry-all-errors --retry-delay 1 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o fase7j-deployments-after.json
          node - <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('fase7j-deployments-after.json','utf8'));if(b?.success!==true)throw new Error('deployment read failed');const d=Array.isArray(b.result?.deployments)?b.result.deployments:b.result;const ids=d.map(x=>String(x.id||'')).filter(Boolean).sort().join(',');const versions=[...new Set(d.flatMap(x=>(x.versions||[]).map(v=>String(v.version_id||''))).filter(Boolean))].sort();if(ids!==process.env.SETTINGS7J_PROD_DEPLOYMENTS||versions.join(',')!==process.env.SETTINGS7J_PROD_VERSIONS||versions.includes(process.env.SETTINGS7J_CONTROLLER_VERSION))throw new Error('production deployment changed');console.log('FASE7J_PRODUCTION_INVARIANT: PASS');
          NODE
      - name: Remove ephemeral material
        if: always()
        run: |
          shred -u .fase7j-runtime-secrets.env 2>/dev/null || rm -f .fase7j-runtime-secrets.env
          rm -f fase7j-*.json fase7j-upload.log
