name: Post Automatici Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Crawler regression
        run: npm run test:crawler
      - name: OpenAI text contract
        run: npm run test:openai
      - name: OpenAI text live probe
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[text-live]')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:openai-live
      - name: OpenAI image contract
        run: npm run test:openai-image
      - name: OpenAI image live probe
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[image-live]')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run test:openai-image-live
      - name: Build
        run: npm run build
