name: Post Automatici Gate

on:
  push:
    branches: [main, "hardening-*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - name: Read-only first prepublish candidate inspection
        if: github.event_name == 'pull_request' && github.head_ref == 'gpt56/prepublish-readonly-inspection'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { neon } from "@neondatabase/serverless";
          if (!process.env.DATABASE_URL) throw new Error("DATABASE_URL_MISSING");
          const sql=neon(process.env.DATABASE_URL);
          const profileId="73486d3c-dca0-4aaa-a69e-d4b08cc6430f";
          const contentId="cefc9287-723d-425f-a2bf-d6c987687b35";
          const variantId="10dc97cd-55a0-4aca-bc7a-6522d18e51fe";
          const rows=await sql`
            select
              p.name as profile_name,
              p.profile_type,
              ci.id::text as content_id,
              ci.topic,
              ci.title,
              ci.pillar,
              ci.source_refs,
              v.id::text as variant_id,
              v.provider,
              v.format,
              v.hook,
              v.caption,
              v.cta,
              v.hashtags,
              v.visual_brief,
              v.alt_text,
              v.image_asset_id::text,
              v.eligible,
              v.approval_mode,
              v.approval_status,
              v.workflow_status,
              v.approved_by,
              v.approved_at::text,
              v.qa_status,
              v.qa_fingerprint,
              v.approved_fingerprint,
              v.qa_checked_at::text,
              v.qa_result,
              j.id::text as publication_job_id,
              j.state as publication_job_state,
              j.execution_mode,
              j.attempt_count,
              j.remote_post_id,
              j.published_at::text as job_published_at,
              sc.status as connection_status,
              sc.provider_account_id,
              sc.account_name,
              sc.expires_at::text as connection_expires_at,
              sc.last_validated_at::text as connection_last_validated_at,
              a.provider as asset_provider,
              a.model as asset_model,
              a.name as asset_name,
              a.mime_type,
              a.width,
              a.height,
              a.format as asset_format,
              a.quality_status as asset_quality_status,
              a.identity_status as asset_identity_status,
              a.metadata as asset_metadata
            from public.content_variants v
            join public.content_items ci on ci.id=v.content_id and ci.profile_id=v.profile_id
            join public.profiles p on p.id=v.profile_id
            left join public.publication_jobs j on j.variant_id=v.id and j.profile_id=v.profile_id
            left join public.social_connections sc on sc.profile_id=v.profile_id and sc.provider=v.provider
            left join public.assets a on a.id=v.image_asset_id and a.profile_id=v.profile_id
            where v.profile_id=${profileId}::uuid
              and v.content_id=${contentId}::uuid
              and v.id=${variantId}::uuid
            order by j.created_at desc nulls last
            limit 1
          `;
          if(!rows[0]) throw new Error("CANDIDATE_NOT_FOUND");
          const r=rows[0];
          const qa=(r.qa_result && typeof r.qa_result==="object")?r.qa_result:{};
          const out={
            profileName:r.profile_name,profileType:r.profile_type,
            contentId:r.content_id,variantId:r.variant_id,
            topic:r.topic,title:r.title,pillar:r.pillar,provider:r.provider,format:r.format,
            hook:r.hook,caption:r.caption,cta:r.cta,hashtags:r.hashtags,
            visualBrief:r.visual_brief,altText:r.alt_text,sourceRefs:r.source_refs,
            asset:{id:r.image_asset_id,provider:r.asset_provider,model:r.asset_model,name:r.asset_name,mimeType:r.mime_type,width:r.width,height:r.height,format:r.asset_format,qualityStatus:r.asset_quality_status,identityStatus:r.asset_identity_status,metadata:r.asset_metadata},
            qa:{status:r.qa_status,fingerprint:r.qa_fingerprint,checkedAt:r.qa_checked_at,
              overallStatus:qa.overallStatus,copyStatus:qa.copyStatus,factStatus:qa.factStatus,brandStatus:qa.brandStatus,
              visualStatus:qa.visualStatus,platformStatus:qa.platformStatus,duplicateStatus:qa.duplicateStatus,budgetStatus:qa.budgetStatus,
              feedCoherenceStatus:qa.feedCoherenceStatus,profileTypeFitStatus:qa.profileTypeFitStatus,subjectStrategyStatus:qa.subjectStrategyStatus,
              reasons:qa.reasons,factCheck:qa.factCheck},
            approval:{mode:r.approval_mode,status:r.approval_status,workflowStatus:r.workflow_status,approvedBy:r.approved_by,approvedAt:r.approved_at,approvedFingerprint:r.approved_fingerprint,eligible:r.eligible},
            publicationJob:{id:r.publication_job_id,state:r.publication_job_state,executionMode:r.execution_mode,attemptCount:r.attempt_count,remotePostId:r.remote_post_id,publishedAt:r.job_published_at},
            destination:{status:r.connection_status,providerAccountId:r.provider_account_id,accountName:r.account_name,expiresAt:r.connection_expires_at,lastValidatedAt:r.connection_last_validated_at}
          };
          console.log("PREPUBLISH_READONLY_RESULT="+JSON.stringify(out));
          NODE
      - { name: Typecheck, run: "npm run typecheck" }
      - { name: Auth security regression, run: "npm run test:auth-security" }
      - { name: Same-origin Auth proxy regression, run: "npm run test:auth-proxy" }
      - { name: Same-origin Auth boundary static regression, run: "npm run test:auth-boundary-static" }
