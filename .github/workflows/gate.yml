name: Post Automatici Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - { name: Typecheck, run: "npm run typecheck" }
      - { name: Auth security regression, run: "npm run test:auth-security" }
      - { name: Same-origin Auth proxy regression, run: "npm run test:auth-proxy" }
      - { name: Same-origin Auth boundary static regression, run: "npm run test:auth-boundary-static" }
      - { name: Platform RBAC regression, run: "npm run test:platform-rbac" }
      - { name: FASE 3 CORE harness absence and audit regression, run: "npm run test:fase3-core" }
      - { name: Admin Audit Viewer regression, run: "npm run test:admin-audit-viewer" }
      - { name: Admin Session Management regression, run: "npm run test:admin-session-management" }
      - { name: Admin Session Management UI regression, run: "npm run test:admin-session-ui" }
      - { name: Admin Ban Unban regression, run: "npm run test:admin-ban-unban" }
      - { name: Admin Ban Unban UI regression, run: "npm run test:admin-ban-unban-ui" }
      - { name: Admin Impersonation API regression, run: "npm run test:admin-impersonation-api" }
      - { name: Admin Impersonation UI regression, run: "npm run test:admin-impersonation-ui" }
      - { name: Audit Viewer ephemeral runtime static safety, run: "npm run test:audit-runtime-static" }
      - { name: Banned-user RLS security regression, run: "npm run test:banned-user-rls" }
      - { name: Tenant security regression, run: "npm run test:tenant-security" }
      - { name: Cross-tenant security regression, run: "npm run test:tenant-cross-security" }
      - { name: Entitlement domain regression, run: "npm run test:entitlements" }
      - { name: Entitlement migration/RLS/idempotency regression, run: "npm run test:entitlement-migration" }
      - { name: AI content text server-side gating regression, run: "npm run test:ai-text-gating" }
      - { name: Worker deploy trigger regression, run: "npm run test:worker-deploy-trigger" }
      - { name: Crawler regression, run: "npm run test:crawler" }
      - { name: Site intelligence regression, run: "npm run test:site-intelligence" }
      - { name: Site intelligence UI regression, run: "npm run test:site-intelligence-ui" }
      - { name: Editorial intelligence regression, run: "npm run test:editorial-intelligence" }
      - { name: Editorial research regression, run: "npm run test:editorial-research" }
      - { name: Multi-agent editorial regression, run: "npm run test:content-agents" }
      - { name: Platform social manager regression, run: "npm run test:platform-social-manager" }
      - { name: Per-profile AI economics regression, run: "npm run test:ai-economics" }
      - { name: OpenAI Research and Fact-check regression, run: "npm run test:openai-research-factcheck" }
      - { name: OpenAI strategist planner regression, run: "npm run test:openai-strategy-planner" }
      - { name: OpenAI editorial QA regression, run: "npm run test:openai-editorial-qa" }
      - { name: Autopilot AI plan runtime regression, run: "npm run test:autopilot-ai-plan" }
      - { name: Learning engine regression, run: "npm run test:learning-engine" }
      - { name: Feedback loop regression, run: "npm run test:feedback-loop" }
      - { name: Content workflow regression, run: "npm run test:content-workflow" }
      - { name: Content semantic dedupe regression, run: "npm run test:content-dedupe" }
      - { name: Calendar workflow regression, run: "npm run test:calendar-workflow" }
      - { name: Social integration contract, run: "npm run test:social" }
      - { name: Social metrics contract, run: "npm run test:social-metrics" }
      - { name: Autopilot route contract, run: "npm run test:autopilot-route" }
      - { name: OpenAI text contract, run: "npm run test:openai" }
      - name: OpenAI text live probe
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[text-live]')
        env: { OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}" }
        run: npm run test:openai-live
      - { name: OpenAI image contract, run: "npm run test:openai-image" }
      - name: OpenAI image live probe
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[image-live]')
        env: { OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}" }
        run: npm run test:openai-image-live
      - { name: Vercel build, run: "npm run build" }
      - { name: Cloudflare bundle dry run, run: "npx wrangler deploy --dry-run" }
