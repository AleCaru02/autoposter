name: Deploy Post Automatici Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-worker]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - { name: Typecheck, run: "npm run typecheck" }
      - { name: Auth security regression, run: "npm run test:auth-security" }
      - { name: Tenant security regression, run: "npm run test:tenant-security" }
      - { name: Cross-tenant security regression, run: "npm run test:tenant-cross-security" }
      - { name: Crawler regression, run: "npm run test:crawler" }
      - { name: Site intelligence regression, run: "npm run test:site-intelligence" }
      - { name: Site intelligence UI regression, run: "npm run test:site-intelligence-ui" }
      - { name: Editorial intelligence regression, run: "npm run test:editorial-intelligence" }
      - { name: Editorial research regression, run: "npm run test:editorial-research" }
      - { name: Multi-agent editorial regression, run: "npm run test:content-agents" }
      - { name: Platform social manager regression, run: "npm run test:platform-social-manager" }
      - { name: Per-profile AI economics regression, run: "npm run test:ai-economics" }
      - { name: OpenAI strategist planner regression, run: "npm run test:openai-strategy-planner" }
      - { name: Learning engine regression, run: "npm run test:learning-engine" }
      - { name: Feedback loop regression, run: "npm run test:feedback-loop" }
      - { name: Content workflow regression, run: "npm run test:content-workflow" }
      - { name: Content semantic dedupe regression, run: "npm run test:content-dedupe" }
      - { name: Calendar workflow regression, run: "npm run test:calendar-workflow" }
      - { name: Social integration contract, run: "npm run test:social" }
      - { name: Social metrics contract, run: "npm run test:social-metrics" }
      - { name: Autopilot route contract, run: "npm run test:autopilot-route" }
      - { name: OpenAI text contract, run: "npm run test:openai" }
      - { name: OpenAI image contract, run: "npm run test:openai-image" }
      - { name: Build, run: "npm run build" }
      - { name: Cloudflare dry run, run: "npx wrangler deploy --dry-run" }
      - name: Generate one-time cross-tenant test token
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "TENANT_CROSS_TEST_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Install one-time cross-tenant test secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$TENANT_CROSS_TEST_TOKEN" | npx wrangler secret put TENANT_CROSS_TEST_TOKEN
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Production tenant isolation audit
        shell: bash
        run: |
          set -euo pipefail
          audit_url="https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -o tenant-audit.json -w "%{http_code}" "$audit_url" || true)
            cat tenant-audit.json || true
            echo
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('tenant-audit.json', 'utf8'));
          if (!payload?.tenantIsolation?.ready) {
            console.error('Tenant isolation audit failed:', JSON.stringify(payload));
            process.exit(1);
          }
          console.log('tenant isolation production audit: PASS', JSON.stringify(payload.tenantIsolation));
          NODE
      - name: Production owner mapping preflight
        shell: bash
        run: |
          set -euo pipefail
          url="https://autoposter.02alessandrocaruso.workers.dev/api/internal/tenant-membership-diagnostic"
          status=$(curl -sS -X POST -o membership-contract-before.json -w "%{http_code}" -H "Authorization: Bearer $TENANT_CROSS_TEST_TOKEN" "$url" || true)
          cat membership-contract-before.json || true
          echo
          CONTRACT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('membership-contract-before.json', 'utf8'));
          const counts = payload?.membershipContract?.counts ?? {};
          const unsafe = Number(counts.profiles_auth_identity_unresolved ?? 1) !== 0
            || Number(counts.profiles_owner_user_id_mismatch ?? 1) !== 0
            || Number(counts.conflicting_owner_memberships ?? 1) !== 0;
          if (process.env.CONTRACT_STATUS !== '200' || payload?.ready !== true || unsafe) {
            console.error('Owner mapping preflight failed:', JSON.stringify({ status: process.env.CONTRACT_STATUS, counts }));
            process.exit(1);
          }
          console.log('owner mapping preflight: PASS', JSON.stringify(counts));
          NODE
      - name: Apply versioned owner membership contract
        shell: bash
        run: |
          set -euo pipefail
          url="https://autoposter.02alessandrocaruso.workers.dev/api/internal/tenant-owner-membership-migrate"
          status=$(curl -sS -X POST -o owner-membership-migration.json -w "%{http_code}" -H "Authorization: Bearer $TENANT_CROSS_TEST_TOKEN" "$url" || true)
          cat owner-membership-migration.json || true
          echo
          MIGRATION_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('owner-membership-migration.json', 'utf8'));
          const counts = payload?.counts ?? {};
          if (process.env.MIGRATION_STATUS !== '200' || payload?.ready !== true || payload?.applied !== true
              || Number(counts.profiles_without_owner ?? 1) !== 0
              || Number(counts.profiles_with_multiple_owners ?? 1) !== 0
              || Number(counts.profiles_without_owner_user_id ?? 1) !== 0
              || Number(counts.profiles_total ?? -1) !== Number(counts.profiles_with_owner ?? -2)) {
            console.error('Owner membership migration failed:', JSON.stringify(payload));
            process.exit(1);
          }
          console.log('owner membership migration: PASS', JSON.stringify(counts));
          NODE
      - name: Production owner contract verification
        shell: bash
        run: |
          set -euo pipefail
          url="https://autoposter.02alessandrocaruso.workers.dev/api/internal/tenant-membership-diagnostic"
          status=$(curl -sS -X POST -o membership-contract-after.json -w "%{http_code}" -H "Authorization: Bearer $TENANT_CROSS_TEST_TOKEN" "$url" || true)
          cat membership-contract-after.json || true
          echo
          CONTRACT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('membership-contract-after.json', 'utf8'));
          const contract = payload?.membershipContract ?? {};
          const counts = contract.counts ?? {};
          const triggerNames = new Set((contract.triggers ?? []).map((item) => item?.trigger_name));
          const functionNames = new Set((contract.functions ?? []).map((item) => item?.function_name));
          const policies = contract.policies ?? [];
          const ownerRead = policies.some((item) => item?.table_name === 'profile_members' && item?.policy_name === 'profile_members_owner_read' && item?.command === 'SELECT');
          const legacyWritePolicy = policies.some((item) => item?.table_name === 'profile_members' && item?.policy_name === 'profile_members_isolation');
          const valid = process.env.CONTRACT_STATUS === '200'
            && payload?.ready === true
            && Number(counts.profiles_without_owner ?? 1) === 0
            && Number(counts.profiles_with_multiple_owners ?? 1) === 0
            && Number(counts.profiles_auth_identity_unresolved ?? 1) === 0
            && Number(counts.profiles_owner_user_id_mismatch ?? 1) === 0
            && Number(counts.conflicting_owner_memberships ?? 1) === 0
            && Number(counts.profiles_total ?? -1) === Number(counts.profiles_with_owner ?? -2)
            && triggerNames.has('profiles_owner_prepare')
            && triggerNames.has('profiles_owner_membership')
            && functionNames.has('current_app_user_id')
            && functionNames.has('sync_profile_owner_membership')
            && ownerRead
            && !legacyWritePolicy;
          if (!valid) {
            console.error('Owner contract verification failed:', JSON.stringify({ status: process.env.CONTRACT_STATUS, counts, triggers: [...triggerNames], functions: [...functionNames], ownerRead, legacyWritePolicy }));
            process.exit(1);
          }
          console.log('owner contract production verification: PASS', JSON.stringify(counts));
          NODE
      - name: Production synthetic tenant A B isolation test
        shell: bash
        run: |
          set -euo pipefail
          AUTH_URL="https://ep-nameless-truth-a698bwer.neonauth.us-west-2.aws.neon.tech/neondb/auth"
          APP_ORIGIN="https://autoposter.02alessandrocaruso.workers.dev"
          CROSS_URL="$APP_ORIGIN/api/internal/tenant-cross-test"
          nonce=$(openssl rand -hex 12)
          email_a="tenant-a-${nonce}@example.com"
          email_b="tenant-b-${nonce}@example.com"
          password_a="Qa9!$(openssl rand -hex 24)"
          password_b="Qa9!$(openssl rand -hex 24)"
          echo "::add-mask::$password_a"
          echo "::add-mask::$password_b"

          cleanup() {
            EMAIL_A="$email_a" EMAIL_B="$email_b" node - <<'NODE' > tenant-cleanup-request.json
          const payload = { mode: 'cleanup', a: { email: process.env.EMAIL_A }, b: { email: process.env.EMAIL_B } };
          process.stdout.write(JSON.stringify(payload));
          NODE
            curl -sS -X POST -H "Authorization: Bearer $TENANT_CROSS_TEST_TOKEN" -H "content-type: application/json" --data-binary @tenant-cleanup-request.json "$CROSS_URL" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          json_body() {
            EMAIL="$1" PASSWORD="$2" LABEL="$3" node - <<'NODE'
          process.stdout.write(JSON.stringify({
            name: `Tenant QA ${process.env.LABEL}`,
            email: process.env.EMAIL,
            password: process.env.PASSWORD,
          }));
          NODE
          }

          login_body() {
            EMAIL="$1" PASSWORD="$2" node - <<'NODE'
          process.stdout.write(JSON.stringify({ email: process.env.EMAIL, password: process.env.PASSWORD }));
          NODE
          }

          extract_header_jwt() {
            awk 'BEGIN{IGNORECASE=1} /^set-auth-jwt:/ {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$1"
          }

          extract_body_jwt() {
            FILE="$1" node - <<'NODE'
          const fs = require('node:fs');
          let value;
          try { value = JSON.parse(fs.readFileSync(process.env.FILE, 'utf8')); } catch { process.exit(0); }
          const isJwt = (x) => typeof x === 'string' && x.length > 80 && x.split('.').length === 3;
          function find(x, depth = 0) {
            if (depth > 7) return null;
            if (isJwt(x)) return x;
            if (!x || typeof x !== 'object') return null;
            for (const child of Object.values(x)) {
              const nested = find(child, depth + 1);
              if (nested) return nested;
            }
            return null;
          }
          process.stdout.write(find(value) || '');
          NODE
          }

          fetch_jwt() {
            local jar="$1" prefix="$2" jwt="" status=""
            status=$(curl -sS -b "$jar" -c "$jar" -D "${prefix}-session.headers" -o "${prefix}-session.json" -w "%{http_code}" -H "accept: application/json" -H "Origin: $APP_ORIGIN" -H "Referer: $APP_ORIGIN/" "$AUTH_URL/get-session" || true)
            if [[ "$status" =~ ^2 ]]; then
              jwt=$(extract_header_jwt "${prefix}-session.headers")
              if [ -z "$jwt" ]; then jwt=$(extract_body_jwt "${prefix}-session.json"); fi
            fi
            if [ -z "$jwt" ]; then
              status=$(curl -sS -b "$jar" -c "$jar" -D "${prefix}-token.headers" -o "${prefix}-token.json" -w "%{http_code}" -H "accept: application/json" -H "Origin: $APP_ORIGIN" -H "Referer: $APP_ORIGIN/" "$AUTH_URL/token" || true)
              if [[ "$status" =~ ^2 ]]; then
                jwt=$(extract_header_jwt "${prefix}-token.headers")
                if [ -z "$jwt" ]; then jwt=$(extract_body_jwt "${prefix}-token.json"); fi
              fi
            fi
            if [ -z "$jwt" ]; then
              status=$(curl -sS -X POST -b "$jar" -c "$jar" -D "${prefix}-token-post.headers" -o "${prefix}-token-post.json" -w "%{http_code}" -H "accept: application/json" -H "content-type: application/json" -H "Origin: $APP_ORIGIN" -H "Referer: $APP_ORIGIN/" --data '{}' "$AUTH_URL/token" || true)
              if [[ "$status" =~ ^2 ]]; then
                jwt=$(extract_header_jwt "${prefix}-token-post.headers")
                if [ -z "$jwt" ]; then jwt=$(extract_body_jwt "${prefix}-token-post.json"); fi
              fi
            fi
            printf '%s' "$jwt"
          }

          make_identity() {
            local label="$1" email="$2" password="$3" jar="$4" prefix="$5"
            local signup_body_file="${prefix}-signup-request.json" status="" jwt=""
            json_body "$email" "$password" "$label" > "$signup_body_file"
            status=$(curl -sS -c "$jar" -D "${prefix}-signup.headers" -o "${prefix}-signup.json" -w "%{http_code}" -X POST -H "content-type: application/json" -H "accept: application/json" -H "Origin: $APP_ORIGIN" -H "Referer: $APP_ORIGIN/" --data-binary "@$signup_body_file" "$AUTH_URL/sign-up/email" || true)
            if [[ ! "$status" =~ ^2 ]]; then
              echo "synthetic tenant $label signup failed with HTTP $status" >&2
              return 1
            fi
            jwt=$(fetch_jwt "$jar" "$prefix")
            if [ -z "$jwt" ]; then
              login_body "$email" "$password" > "${prefix}-signin-request.json"
              status=$(curl -sS -b "$jar" -c "$jar" -D "${prefix}-signin.headers" -o "${prefix}-signin.json" -w "%{http_code}" -X POST -H "content-type: application/json" -H "accept: application/json" -H "Origin: $APP_ORIGIN" -H "Referer: $APP_ORIGIN/" --data-binary "@${prefix}-signin-request.json" "$AUTH_URL/sign-in/email" || true)
              if [[ ! "$status" =~ ^2 ]]; then
                echo "synthetic tenant $label signin failed with HTTP $status" >&2
                return 1
              fi
              jwt=$(fetch_jwt "$jar" "$prefix")
            fi
            if [ -z "$jwt" ]; then
              echo "synthetic tenant $label JWT acquisition failed" >&2
              return 1
            fi
            printf '%s' "$jwt"
          }

          jwt_a=$(make_identity A "$email_a" "$password_a" a.cookies a)
          echo "::add-mask::$jwt_a"
          jwt_b=$(make_identity B "$email_b" "$password_b" b.cookies b)
          echo "::add-mask::$jwt_b"

          EMAIL_A="$email_a" EMAIL_B="$email_b" JWT_A="$jwt_a" JWT_B="$jwt_b" CROSS_URL="$CROSS_URL" node - <<'NODE'
          const headers = { authorization: `Bearer ${process.env.TENANT_CROSS_TEST_TOKEN}`, 'content-type': 'application/json' };
          const identities = {
            a: { email: process.env.EMAIL_A, jwt: process.env.JWT_A },
            b: { email: process.env.EMAIL_B, jwt: process.env.JWT_B },
          };
          async function call(body, label) {
            const response = await fetch(process.env.CROSS_URL, { method: 'POST', headers, body: JSON.stringify(body) });
            let payload;
            try { payload = await response.json(); } catch { payload = { error: 'NON_JSON_RESPONSE' }; }
            console.log(`${label}:`, response.status, JSON.stringify(payload));
            if (!response.ok || payload?.ready === false) throw new Error(`${label}_FAILED:${payload?.error || response.status}`);
            return payload;
          }
          const prepared = await call({ mode: 'prepare', ...identities }, 'tenant prepare');
          const fixtures = prepared?.fixtures;
          if (!fixtures?.a?.profileId || !fixtures?.b?.profileId) throw new Error('TENANT_PREPARE_FIXTURES_MISSING');

          const phaseSpecs = [
            ['phase-1', 22],
            ['phase-2a', 13],
            ['phase-2b', 13],
          ];
          const allChecks = [];
          for (const [mode, expectedCount] of phaseSpecs) {
            const phase = await call({ mode, ...identities, fixtures }, mode);
            const checks = Array.isArray(phase?.checks) ? phase.checks : [];
            if (checks.length !== expectedCount) throw new Error(`${mode}_CHECK_COUNT_${checks.length}_EXPECTED_${expectedCount}`);
            const failed = checks.filter((item) => item?.pass !== true);
            if (failed.length) throw new Error(`${mode}_SECURITY_FAILURE:${JSON.stringify(failed)}`);
            allChecks.push(...checks);
          }
          const names = new Set(allChecks.map((item) => item?.name));
          if (allChecks.length !== 48 || names.size !== 48) throw new Error(`TENANT_CHECK_SET_INVALID:${allChecks.length}/${names.size}`);

          async function cleanup(label) {
            const response = await fetch(process.env.CROSS_URL, {
              method: 'POST',
              headers,
              body: JSON.stringify({ mode: 'cleanup', a: { email: identities.a.email }, b: { email: identities.b.email } }),
            });
            const payload = await response.json();
            console.log(`${label}:`, response.status, JSON.stringify(payload));
            if (!response.ok || payload?.cleanup !== 'PASS') throw new Error(`${label}_FAILED`);
          }
          await cleanup('tenant cleanup');
          await cleanup('tenant cleanup idempotent verification');
          console.log(`tenant A/B production isolation: PASS (${allChecks.length}/48 checks, cleanup PASS)`);
          NODE
      - name: Remove one-time cross-tenant test secret
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s\n' '{"TENANT_CROSS_TEST_TOKEN":null}' | npx wrangler secret bulk
