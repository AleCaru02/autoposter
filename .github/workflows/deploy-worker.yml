name: Deploy Post Automatici Worker

on:
  workflow_run:
    workflows: ["Post Automatici Gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: post-automatici-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact gated SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Detect controlled prepublish mode
        id: prepublish_mode
        shell: bash
        run: |
          set -euo pipefail
          message=$(git log -1 --pretty=%B)
          if printf '%s\n' "$message" | grep -Fq '[prepublish-qa]'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - { name: Typecheck, run: "npm run typecheck" }
      - { name: Auth security regression, run: "npm run test:auth-security" }
      - { name: Same-origin Auth proxy regression, run: "npm run test:auth-proxy" }
      - { name: Same-origin Auth boundary static regression, run: "npm run test:auth-boundary-static" }
      - { name: User-facing error boundary regression, run: "npm run test:user-error-boundary" }
      - { name: Platform RBAC regression, run: "npm run test:platform-rbac" }
      - { name: FASE 3 CORE harness absence and audit regression, run: "npm run test:fase3-core" }
      - { name: Admin Audit Viewer regression, run: "npm run test:admin-audit-viewer" }
      - { name: Admin Session Management regression, run: "npm run test:admin-session-management" }
      - { name: Admin Session Management UI regression, run: "npm run test:admin-session-ui" }
      - { name: Admin Ban Unban regression, run: "npm run test:admin-ban-unban" }
      - { name: Admin Ban Unban UI regression, run: "npm run test:admin-ban-unban-ui" }
      - { name: Admin Impersonation API regression, run: "npm run test:admin-impersonation-api" }
      - { name: Tenant security regression, run: "npm run test:tenant-security" }
      - { name: Cross-tenant security regression, run: "npm run test:tenant-cross-security" }
      - { name: PROPERTY NETWORK profile isolation regression, run: "npm run test:profile-isolation" }
      - { name: Brand analysis server-side gating regression, run: "npm run test:brand-analysis-gating" }
      - { name: Crawler regression, run: "npm run test:crawler" }
      - { name: Site intelligence regression, run: "npm run test:site-intelligence" }
      - { name: Site intelligence UI regression, run: "npm run test:site-intelligence-ui" }
      - { name: Editorial intelligence regression, run: "npm run test:editorial-intelligence" }
      - { name: Editorial research regression, run: "npm run test:editorial-research" }
      - { name: Multi-agent editorial regression, run: "npm run test:content-agents" }
      - { name: Platform social manager regression, run: "npm run test:platform-social-manager" }
      - { name: Per-profile AI economics regression, run: "npm run test:ai-economics" }
      - { name: OpenAI strategist planner regression, run: "npm run test:openai-strategy-planner" }
      - { name: Learning engine regression, run: "npm run test:learning-engine" }
      - { name: Feedback loop regression, run: "npm run test:feedback-loop" }
      - { name: Content workflow regression, run: "npm run test:content-workflow" }
      - { name: Content semantic dedupe regression, run: "npm run test:content-dedupe" }
      - { name: Asset library runtime regression, run: "npm run test:asset-library" }
      - { name: Calendar workflow regression, run: "npm run test:calendar-workflow" }
      - { name: Blocked calendar reschedule regression, run: "npm run test:blocked-calendar-reschedule" }
      - { name: FASE 7F safe publication engine regression, run: "npm run test:fase7f-publication-engine" }
      - { name: Immutable publication QA boundary regression, run: "npm run test:publication-qa-guard" }
      - { name: Social integration contract, run: "npm run test:social" }
      - { name: Social runtime preflight regression, run: "npm run test:social-runtime-preflight" }
      - { name: Global social Safe Mode regression, run: "npm run test:safe-mode" }
      - { name: Higgsfield Personal Brand foundation regression, run: "npm run test:higgsfield-personal-brand" }
      - { name: Higgsfield runtime credential boundary, run: "npm run test:higgsfield-runtime" }
      - { name: Personal Brand reference and Soul ID preflight, run: "npm run test:personal-brand-reference" }
      - { name: Autonomous visual routing persistence, run: "npm run test:visual-routing-persistence" }
      - { name: Metered Personal Brand Identity QA, run: "npm run test:identity-qa-runtime" }
      - { name: Social metrics contract, run: "npm run test:social-metrics" }
      - { name: FASE 7H analytics engine regression, run: "npm run test:fase7h-analytics-engine" }
      - { name: Provider analytics certification, run: "npm run test:provider-analytics-certification" }
      - { name: Mobile / desktop UI QA contract, run: "npm run test:mobile-desktop-ui-qa" }
      - { name: FASE 7J settings and account regression, run: "npm run test:fase7j-settings-account" }
      - { name: Persistent demo tenant infrastructure regression, run: "npm run test:persistent-demo" }
      - { name: Final personal readiness runner regression, run: "npm run test:final-personal-readiness" }
      - { name: Release candidate migration safety regression, run: "npm run test:release-candidate-migration" }
      - { name: Autopilot route contract, run: "npm run test:autopilot-route" }
      - { name: OpenAI text contract, run: "npm run test:openai" }
      - { name: OpenAI image contract, run: "npm run test:openai-image" }
      - { name: Build, run: "npm run build" }
      - name: Higgsfield frontend secret absence regression
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -I -n -E 'HF_CREDENTIALS|hf-api-key|hf-secret' dist; then
            echo "Higgsfield server-only identifiers leaked into frontend bundle or source maps" >&2
            exit 1
          fi
          echo "Higgsfield frontend secret absence: PASS"
      - { name: Cloudflare dry run, run: "npx wrangler deploy --dry-run" }
      - name: Provision ephemeral admin bootstrap secret
        if: contains(github.event.workflow_run.head_commit.message, '[bootstrap-admin]')
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "ADMIN_BOOTSTRAP_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
      - name: Provision ephemeral controlled prepublish QA secret
        if: steps.prepublish_mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "PREPUBLISH_QA_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
      - name: Provision ephemeral provider analytics QA secret
        if: contains(github.event.workflow_run.head_commit.message, '[provider-analytics-qa]')
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "PROVIDER_ANALYTICS_QA_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
      - name: Prepare Worker secrets
        shell: bash
        env:
          OPENAI_API_KEY_SOURCE: ${{ secrets.OPENAI_API_KEY }}
          SOCIAL_TOKEN_KEY_SOURCE: ${{ secrets.SOCIAL_TOKEN_KEY }}
          META_APP_SECRET_SOURCE: ${{ secrets.META_APP_SECRET }}
          LINKEDIN_CLIENT_SECRET_SOURCE: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET_SOURCE: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          HF_CREDENTIALS_SOURCE: ${{ secrets.HF_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY_SOURCE" ]; then
            echo "Required GitHub secret OPENAI_API_KEY is missing" >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const requiredOpenAi = process.env.OPENAI_API_KEY_SOURCE?.trim();
          if (!requiredOpenAi) {
            console.error('Required GitHub secret OPENAI_API_KEY is missing');
            process.exit(1);
          }
          const secrets = { OPENAI_API_KEY: requiredOpenAi };
          const optionalSocialSecrets = {
            SOCIAL_TOKEN_KEY: process.env.SOCIAL_TOKEN_KEY_SOURCE,
            META_APP_SECRET: process.env.META_APP_SECRET_SOURCE,
            LINKEDIN_CLIENT_SECRET: process.env.LINKEDIN_CLIENT_SECRET_SOURCE,
            GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET_SOURCE,
            HF_CREDENTIALS: process.env.HF_CREDENTIALS_SOURCE,
          };
          for (const [name, raw] of Object.entries(optionalSocialSecrets)) {
            const value = raw?.trim();
            if (value) secrets[name] = value;
          }
          const bootstrap = process.env.ADMIN_BOOTSTRAP_TOKEN_VALUE?.trim();
          if (bootstrap) secrets.ADMIN_BOOTSTRAP_TOKEN = bootstrap;
          const prepublishQa = process.env.PREPUBLISH_QA_TOKEN_VALUE?.trim();
          if (prepublishQa) secrets.PREPUBLISH_QA_TOKEN = prepublishQa;
          const providerAnalyticsQa = process.env.PROVIDER_ANALYTICS_QA_TOKEN_VALUE?.trim();
          if (providerAnalyticsQa) secrets.PROVIDER_ANALYTICS_QA_TOKEN = providerAnalyticsQa;
          fs.writeFileSync('worker-secrets.json', JSON.stringify(secrets), { mode: 0o600 });
          NODE
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f worker-secrets.json' EXIT
          npx wrangler deploy --secrets-file worker-secrets.json
      - name: Verify Worker secret bindings and public config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > worker-secret-names.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/settings" \
            > worker-settings.json
          node - <<'NODE'
          const fs = require('node:fs');
          const secrets = JSON.parse(fs.readFileSync('worker-secret-names.json', 'utf8'));
          const names = new Set(Array.isArray(secrets) ? secrets.map((item) => item?.name).filter(Boolean) : []);
          const requiredSecrets = [
            'OPENAI_API_KEY',
            'DATABASE_URL',
            'SOCIAL_TOKEN_KEY',
            'META_APP_SECRET',
            'LINKEDIN_CLIENT_SECRET',
            'GOOGLE_CLIENT_SECRET',
            'HF_CREDENTIALS',
          ];
          // Higgsfield credentials are required for the Personal Brand image runtime.
          // Only the binding name is verified here; the value is never read or printed.
          const missing = requiredSecrets.filter((name) => !names.has(name));
          if (missing.length) {
            console.error('Cloudflare Worker required secret bindings are missing:', missing.join(', '));
            process.exit(1);
          }
          if (names.has('GOOGLE_CLIENT_ID')) {
            console.error('GOOGLE_CLIENT_ID must be a public Worker var, not a Worker secret');
            process.exit(1);
          }
          const settings = JSON.parse(fs.readFileSync('worker-settings.json', 'utf8'));
          const bindings = settings?.result?.bindings;
          const higgsfieldPlainText = Array.isArray(bindings)
            ? bindings.find((binding) => binding?.name === 'HF_CREDENTIALS' && binding?.type === 'plain_text')
            : undefined;
          if (higgsfieldPlainText) {
            console.error('HF_CREDENTIALS must never be a plain_text Worker binding');
            process.exit(1);
          }
          const googleClientId = Array.isArray(bindings)
            ? bindings.find((binding) => binding?.name === 'GOOGLE_CLIENT_ID' && binding?.type === 'plain_text')
            : undefined;
          if (typeof googleClientId?.text !== 'string' || !googleClientId.text.endsWith('.apps.googleusercontent.com')) {
            console.error('Cloudflare Worker required public config is missing or invalid: GOOGLE_CLIENT_ID');
            process.exit(1);
          }
          if (process.env.ADMIN_BOOTSTRAP_TOKEN_VALUE && !names.has('ADMIN_BOOTSTRAP_TOKEN')) {
            console.error('Cloudflare Worker bootstrap secret was not provisioned');
            process.exit(1);
          }
          if (process.env.PREPUBLISH_QA_TOKEN_VALUE && !names.has('PREPUBLISH_QA_TOKEN')) {
            console.error('Worker controlled prepublish QA secret was not provisioned');
            process.exit(1);
          }
          console.log('Worker secret bindings and public config: PASS');
          NODE
      - name: Production application smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://autoposter.02alessandrocaruso.workers.dev"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -L -o production-app.html -w "%{http_code}" -H "accept: text/html" "$base/app/dashboard" || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          APP_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('production-app.html', 'utf8');
          if (process.env.APP_STATUS !== '200' || !/<!doctype html|<html/i.test(html) || html.length < 200) {
            console.error('Production application smoke failed:', JSON.stringify({ status: process.env.APP_STATUS, htmlBytes: html.length }));
            process.exit(1);
          }
          console.log('production application smoke: PASS', JSON.stringify({ status: process.env.APP_STATUS, htmlBytes: html.length }));
          NODE
      - name: Production same-origin Auth proxy smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://autoposter.02alessandrocaruso.workers.dev"
          session_status=$(curl -sS -D auth-session-headers.txt -o auth-session.json -w "%{http_code}" -H 'accept: application/json' "$base/api/auth/get-session" || true)
          if [ "$session_status" != "200" ]; then
            echo "same-origin get-session failed: HTTP $session_status" >&2
            exit 1
          fi
          if ! tr -d '\r' < auth-session-headers.txt | grep -Eiq '^cache-control:.*no-store'; then
            echo "same-origin get-session missing no-store" >&2
            exit 1
          fi
          foreign_status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'origin: https://evil.invalid' -H 'content-type: application/json' --data '{}' "$base/api/auth/sign-in/email" || true)
          if [ "$foreign_status" != "403" ]; then
            echo "foreign Origin was not denied: HTTP $foreign_status" >&2
            exit 1
          fi
          override_status=$(curl -sS -o /dev/null -w "%{http_code}" "$base/api/auth/get-session?upstream=https%3A%2F%2Fevil.invalid" || true)
          if [ "$override_status" != "400" ]; then
            echo "Auth upstream override was not denied: HTTP $override_status" >&2
            exit 1
          fi
          echo "production same-origin Auth proxy smoke: PASS"
      - name: Production tenant and owner security audit
        shell: bash
        run: |
          set -euo pipefail
          audit_url="https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -o tenant-audit.json -w "%{http_code}" "$audit_url" || true)
            cat tenant-audit.json || true
            echo
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          AUDIT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('tenant-audit.json', 'utf8'));
          const tenant = payload?.tenantIsolation ?? {};
          const owner = payload?.ownerContract ?? {};
          const valid = process.env.AUDIT_STATUS === '200'
            && payload?.ready === true
            && tenant?.ready === true
            && owner?.ready === true
            && Number(owner.profilesWithoutOwner ?? 1) === 0
            && Number(owner.profilesWithMultipleOwners ?? 1) === 0
            && Number(owner.profilesAuthIdentityUnresolved ?? 1) === 0
            && Number(owner.profilesOwnerUserIdMismatch ?? 1) === 0
            && Number(owner.profilesTotal ?? -1) === Number(owner.profilesWithOwner ?? -2);
          if (!valid) {
            console.error('Production tenant/owner audit failed:', JSON.stringify({ status: process.env.AUDIT_STATUS, tenant, owner }));
            process.exit(1);
          }
          console.log('production tenant/owner audit: PASS', JSON.stringify({ tenant, owner }));
          NODE
      - name: Production Managed Auth capability audit
        shell: bash
        run: |
          set -euo pipefail
          audit_url="https://autoposter.02alessandrocaruso.workers.dev/api/security/managed-auth-capabilities"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -o managed-auth.json -w "%{http_code}" "$audit_url" || true)
            cat managed-auth.json || true
            echo
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          AUTH_AUDIT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('managed-auth.json', 'utf8'));
          const managedAuth = payload?.managedAuth ?? {};
          const endpoints = Object.values(managedAuth.endpoints ?? {});
          const valid = process.env.AUTH_AUDIT_STATUS === '200'
            && managedAuth.ready === true
            && managedAuth.coreAuthReachable === true
            && managedAuth.adminPluginActive === true
            && endpoints.every((endpoint) => endpoint?.state !== 'UNSAFE');
          if (!valid) {
            console.error('Production Managed Auth capability audit failed:', JSON.stringify({ status: process.env.AUTH_AUDIT_STATUS, managedAuth }));
            process.exit(1);
          }
          console.log('production managed auth capability audit: PASS', JSON.stringify({ managedAuth }));
          NODE
      - name: Install Playwright Chromium for production UI QA
        if: contains(github.event.workflow_run.head_commit.message, '[ui-qa]')
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Production four viewport UI smoke
        if: contains(github.event.workflow_run.head_commit.message, '[ui-qa]')
        env:
          UI_SMOKE_BASE: https://autoposter.02alessandrocaruso.workers.dev
          UI_SMOKE_START_LOCAL: "0"
        run: node tests/mobile-desktop-ui-browser.mjs
      - name: Controlled provider analytics read-only certification
        if: contains(github.event.workflow_run.head_commit.message, '[provider-analytics-qa]')
        shell: bash
        run: |
          set -euo pipefail
          base="https://autoposter.02alessandrocaruso.workers.dev"
          status=$(curl --silent --show-error -o provider-analytics-qa.json -w "%{http_code}" -X POST \
            -H "x-provider-analytics-qa-token: $PROVIDER_ANALYTICS_QA_TOKEN_VALUE" \
            "$base/api/internal/provider-analytics-certify" || true)
          ANALYTICS_QA_HTTP_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('provider-analytics-qa.json','utf8'));
          const calls=Array.isArray(body?.providerCalls)?body.providerCalls:[];
          const metrics=body?.metricsNormalized&&typeof body.metricsNormalized==='object'?body.metricsNormalized:{};
          const summary={
            httpStatus:process.env.ANALYTICS_QA_HTTP_STATUS,
            certified:body?.certified===true,
            error:body?.error??null,
            safeMode:body?.safeMode,
            requestType:body?.requestType,
            externalWrite:body?.externalWrite,
            provider:body?.provider??null,
            account:body?.account??null,
            mapping:body?.mapping??null,
            metricsNormalized:metrics,
            providerCalls:calls.map((call)=>({
              endpoint:call?.endpoint??null,
              metric:call?.metric??null,
              fields:call?.fields??null,
              queryType:call?.queryType??null,
              method:call?.method??null,
              status:call?.status??null,
              rawNumericFields:call?.rawNumericFields??{},
            })),
          };
          console.log('controlled provider analytics result:',JSON.stringify(summary));
          const valid=process.env.ANALYTICS_QA_HTTP_STATUS==='200'
            && body?.certified===true
            && body?.safeMode===true
            && body?.requestType==='READ_ONLY'
            && body?.externalWrite===false
            && typeof body?.provider==='string'
            && typeof body?.mapping?.contentId==='string'
            && typeof body?.mapping?.publicationJobId==='string'
            && typeof body?.mapping?.externalPostId==='string'
            && Object.keys(metrics).length>0
            && calls.length>0
            && calls.every((call)=>call?.method==='GET');
          if(!valid) process.exit(1);
          console.log('controlled provider analytics read-only certification: PASS');
          NODE
      - name: Remove ephemeral provider analytics QA secret
        if: always() && contains(github.event.workflow_run.head_commit.message, '[provider-analytics-qa]')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          printf 'y\n' | npx wrangler secret delete PROVIDER_ANALYTICS_QA_TOKEN || true
      - name: Verify provider analytics certification route closed
        if: always() && contains(github.event.workflow_run.head_commit.message, '[provider-analytics-qa]')
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -X POST -o /dev/null -w "%{http_code}" "https://autoposter.02alessandrocaruso.workers.dev/api/internal/provider-analytics-certify" || true)
          if [ "$status" != "404" ]; then
            echo "Provider analytics certification route did not fail closed after secret removal: HTTP $status" >&2
            exit 1
          fi
          echo "provider analytics certification route closed: PASS"
      - name: Controlled prepublish QA
        if: steps.prepublish_mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://autoposter.02alessandrocaruso.workers.dev"
          status="404"
          for attempt in {1..12}; do
            status=$(curl --silent --show-error -o controlled-prepublish-qa.json -w "%{http_code}" -X POST \
              -H "x-prepublish-qa-token: $PREPUBLISH_QA_TOKEN_VALUE" \
              -H "content-type: application/json" \
              --data '{"action":"REGENERATE_VISUAL_AND_QA","profileId":"73486d3c-dca0-4aaa-a69e-d4b08cc6430f","contentId":"cefc9287-723d-425f-a2bf-d6c987687b35","variantId":"10dc97cd-55a0-4aca-bc7a-6522d18e51fe"}' \
              "$base/api/internal/prepublish-qa" || true)
            if [ "$status" != "404" ]; then break; fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          QA_HTTP_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('controlled-prepublish-qa.json','utf8'));
          const qa=body?.qa??{};
          const summary={
            httpStatus:process.env.QA_HTTP_STATUS,error:body?.error??null,safeMode:body?.safeMode,publicationJobId:body?.publicationJobId,
            candidate:body?.candidate??null,
            visualRegeneration:body?.visual??null,
            overallStatus:qa?.overallStatus,brandStatus:qa?.brandStatus,copyStatus:qa?.copyStatus,
            visualStatus:qa?.visualStatus,factStatus:qa?.factStatus,platformStatus:qa?.platformStatus,
            duplicateStatus:qa?.duplicateStatus,budgetStatus:qa?.budgetStatus,
            feedCoherenceStatus:qa?.feedCoherenceStatus,profileTypeFitStatus:qa?.profileTypeFitStatus,
            subjectStrategyStatus:qa?.subjectStrategyStatus,
            reasons:Array.isArray(qa?.reasons)?qa.reasons:[],
            sources:Array.isArray(qa?.factCheck?.sources)?qa.factCheck.sources:[],
          };
          console.log('controlled prepublish QA result:',JSON.stringify(summary));
          if(process.env.QA_HTTP_STATUS!=='200'||body?.safeMode!==true||qa?.overallStatus!=='PASS') process.exit(1);
          console.log('controlled prepublish QA: PASS');
          NODE
      - name: Report controlled prepublish result to pull request
        if: steps.prepublish_mode.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const token=process.env.GH_TOKEN;
          const repo=process.env.REPOSITORY;
          const sha=process.env.HEAD_SHA;
          const headers={authorization:`Bearer ${token}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28'};
          const pullsResponse=await fetch(`https://api.github.com/repos/${repo}/commits/${sha}/pulls`,{headers});
          if(!pullsResponse.ok) throw new Error(`PR_LOOKUP_HTTP_${pullsResponse.status}`);
          const pulls=await pullsResponse.json();
          const pr=Array.isArray(pulls)?pulls[0]:null;
          if(!pr?.number) {
            console.log('controlled prepublish report: no pull request for gated SHA, skipping PR comment');
            process.exit(0);
          }
          const body=JSON.parse(fs.readFileSync('controlled-prepublish-qa.json','utf8'));
          const qa=body?.qa??{};
          const candidate=body?.candidate??{};
          const asset=candidate?.asset??{};
          const sources=Array.isArray(qa?.factCheck?.sources)?qa.factCheck.sources:[];
          const safeText=(value,max=6000)=>typeof value==='string'?value.slice(0,max):'';
          const report=[
            '## FIRST REAL PREPUBLISH REPORT',
            '',
            `SAFE_MODE: ${body?.safeMode===true?'true':'INVALID'}`,
            `PUBLICATION_JOB: ${safeText(body?.publicationJobId,120)}`,
            `PROFILO: ${safeText(candidate?.profileName,300)}`,
            `PIATTAFORMA: ${safeText(candidate?.platform,100)}`,
            `FORMATO: ${safeText(candidate?.format,100)}`,
            `ACCOUNT_DESTINAZIONE: ${safeText(candidate?.accountName,300)}`,
            `CONNECTION_STATUS: ${safeText(candidate?.connectionStatus,100)}`,
            `TITOLO: ${safeText(candidate?.title,800)}`,
            `HOOK: ${safeText(candidate?.hook,1200)}`,
            '',
            'COPY:',
            safeText(candidate?.caption,6000),
            '',
            `CTA: ${safeText(candidate?.cta,1200)}`,
            `ASSET_ID: ${safeText(asset?.id,120)}`,
            `ASSET_NAME: ${safeText(asset?.name,500)}`,
            `ASSET_PROVIDER: ${safeText(asset?.provider,100)}`,
            `ASSET_MODEL: ${safeText(asset?.model,100)}`,
            `ASSET_QUALITY: ${safeText(asset?.qualityStatus,100)}`,
            `ASSET_IDENTITY: ${safeText(asset?.identityStatus,100)}`,
            `APPROVAL_STATUS: ${safeText(candidate?.approvalStatus,100)}`,
            `WORKFLOW_STATUS: ${safeText(candidate?.workflowStatus,100)}`,
            '',
            'QA:',
            `OVERALL=${safeText(qa?.overallStatus,100)}`,
            `COPY=${safeText(qa?.copyStatus,100)}`,
            `FACT=${safeText(qa?.factStatus,100)}`,
            `BRAND=${safeText(qa?.brandStatus,100)}`,
            `VISUAL=${safeText(qa?.visualStatus,100)}`,
            `PLATFORM=${safeText(qa?.platformStatus,100)}`,
            `DUPLICATE=${safeText(qa?.duplicateStatus,100)}`,
            `BUDGET=${safeText(qa?.budgetStatus,100)}`,
            `FEED_COHERENCE=${safeText(qa?.feedCoherenceStatus,100)}`,
            `PROFILE_TYPE_FIT=${safeText(qa?.profileTypeFitStatus,100)}`,
            `SUBJECT_STRATEGY=${safeText(qa?.subjectStrategyStatus,100)}`,
            '',
            `FONTI: ${sources.length?sources.map((source)=>safeText(source,500)).join(' | '):'nessuna fonte esterna richiesta/registrata'}`,
            '',
            'Nessuna approvazione utente simulata. Nessuna external write eseguita.'
          ].join('\n');
          const commentResponse=await fetch(`https://api.github.com/repos/${repo}/issues/${pr.number}/comments`,{
            method:'POST',headers,body:JSON.stringify({body:report})
          });
          if(!commentResponse.ok) throw new Error(`PR_COMMENT_HTTP_${commentResponse.status}`);
          console.log('controlled prepublish report comment: PASS',JSON.stringify({pr:pr.number}));
          NODE
      - name: Remove ephemeral controlled prepublish QA secret
