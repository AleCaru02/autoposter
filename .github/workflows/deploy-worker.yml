          if (process.env.BOOTSTRAP_STATUS !== '200' || body?.configured !== true || body?.ownerIdentityCount !== 1) {
            console.error('Initial SUPER_ADMIN bootstrap failed:', JSON.stringify({ status: process.env.BOOTSTRAP_STATUS, body }));
            process.exit(1);
          }
          console.log('initial SUPER_ADMIN bootstrap: PASS', JSON.stringify(body));
