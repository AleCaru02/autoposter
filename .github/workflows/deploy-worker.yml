          set -euo pipefail
          printf 'y\n' | npx wrangler secret delete PREPUBLISH_QA_TOKEN
      - name: Verify controlled prepublish QA route closed
        if: always() && steps.prepublish_mode.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -X POST -o /dev/null -w "%{http_code}" "https://autoposter.02alessandrocaruso.workers.dev/api/internal/prepublish-qa" || true)
          if [ "$status" != "404" ]; then
            echo "Controlled prepublish QA route did not fail closed after secret removal: HTTP $status" >&2
            exit 1
          fi
          echo "controlled prepublish QA route closed: PASS"
