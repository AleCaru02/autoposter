name: Deploy Post Automatici Worker

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-worker]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - { name: Typecheck, run: "npm run typecheck" }
      - { name: Auth security regression, run: "npm run test:auth-security" }
      - { name: Tenant security regression, run: "npm run test:tenant-security" }
      - { name: Crawler regression, run: "npm run test:crawler" }
      - { name: Site intelligence regression, run: "npm run test:site-intelligence" }
      - { name: Site intelligence UI regression, run: "npm run test:site-intelligence-ui" }
      - { name: Editorial intelligence regression, run: "npm run test:editorial-intelligence" }
      - { name: Editorial research regression, run: "npm run test:editorial-research" }
      - { name: Multi-agent editorial regression, run: "npm run test:content-agents" }
      - { name: Platform social manager regression, run: "npm run test:platform-social-manager" }
      - { name: Per-profile AI economics regression, run: "npm run test:ai-economics" }
      - { name: OpenAI strategist planner regression, run: "npm run test:openai-strategy-planner" }
      - { name: Learning engine regression, run: "npm run test:learning-engine" }
      - { name: Feedback loop regression, run: "npm run test:feedback-loop" }
      - { name: Content workflow regression, run: "npm run test:content-workflow" }
      - { name: Content semantic dedupe regression, run: "npm run test:content-dedupe" }
      - { name: Calendar workflow regression, run: "npm run test:calendar-workflow" }
      - { name: Social integration contract, run: "npm run test:social" }
      - { name: Social metrics contract, run: "npm run test:social-metrics" }
      - { name: Autopilot route contract, run: "npm run test:autopilot-route" }
      - { name: OpenAI text contract, run: "npm run test:openai" }
      - { name: OpenAI image contract, run: "npm run test:openai-image" }
      - { name: Build, run: "npm run build" }
      - { name: Cloudflare dry run, run: "npx wrangler deploy --dry-run" }
      - name: Generate one-time migration token
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "MIGRATION_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Install one-time migration secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s' "$MIGRATION_TOKEN" | npx wrangler secret put MIGRATION_TOKEN
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Apply tenant anonymous privilege hardening
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST \
            -H "Authorization: Bearer $MIGRATION_TOKEN" \
            "https://autoposter.02alessandrocaruso.workers.dev/api/internal/tenant-privilege-migrate")
          echo "$response"
          MIGRATION_RESPONSE="$response" node - <<'NODE'
          const payload = JSON.parse(process.env.MIGRATION_RESPONSE || '{}');
          if (payload?.applied !== true || payload?.migration !== '20260830_tenant_anonymous_privilege_hardening') {
            console.error('Tenant privilege migration did not confirm success');
            process.exit(1);
          }
          console.log('tenant anonymous privilege migration: APPLIED');
          NODE
      - name: Production tenant isolation audit
        shell: bash
        run: |
          set -euo pipefail
          audit_url="https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -o tenant-audit.json -w "%{http_code}" "$audit_url" || true)
            cat tenant-audit.json || true
            echo
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('tenant-audit.json', 'utf8'));
          if (!payload?.tenantIsolation?.ready) {
            console.error('Tenant isolation audit failed:', JSON.stringify(payload));
            process.exit(1);
          }
          console.log('tenant isolation production audit: PASS', JSON.stringify(payload.tenantIsolation));
          NODE
      - name: Remove one-time migration secret
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: printf '%s\n' '{"MIGRATION_TOKEN":null}' | npx wrangler secret bulk
