name: Deploy Post Automatici Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'api/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - { name: Typecheck, run: "npm run typecheck" }
      - { name: Auth security regression, run: "npm run test:auth-security" }
      - { name: Same-origin Auth proxy regression, run: "npm run test:auth-proxy" }
      - { name: Same-origin Auth boundary static regression, run: "npm run test:auth-boundary-static" }
      - { name: Platform RBAC regression, run: "npm run test:platform-rbac" }
      - { name: FASE 3 CORE harness absence and audit regression, run: "npm run test:fase3-core" }
      - { name: Admin Audit Viewer regression, run: "npm run test:admin-audit-viewer" }
      - { name: Admin Session Management regression, run: "npm run test:admin-session-management" }
      - { name: Admin Session Management UI regression, run: "npm run test:admin-session-ui" }
      - { name: Admin Ban Unban regression, run: "npm run test:admin-ban-unban" }
      - { name: Admin Ban Unban UI regression, run: "npm run test:admin-ban-unban-ui" }
      - { name: Admin Impersonation API regression, run: "npm run test:admin-impersonation-api" }
      - { name: Tenant security regression, run: "npm run test:tenant-security" }
      - { name: Cross-tenant security regression, run: "npm run test:tenant-cross-security" }
      - { name: Brand analysis server-side gating regression, run: "npm run test:brand-analysis-gating" }
      - { name: Crawler regression, run: "npm run test:crawler" }
      - { name: Site intelligence regression, run: "npm run test:site-intelligence" }
      - { name: Site intelligence UI regression, run: "npm run test:site-intelligence-ui" }
      - { name: Editorial intelligence regression, run: "npm run test:editorial-intelligence" }
      - { name: Editorial research regression, run: "npm run test:editorial-research" }
      - { name: Multi-agent editorial regression, run: "npm run test:content-agents" }
      - { name: Platform social manager regression, run: "npm run test:platform-social-manager" }
      - { name: Per-profile AI economics regression, run: "npm run test:ai-economics" }
      - { name: OpenAI strategist planner regression, run: "npm run test:openai-strategy-planner" }
      - { name: Learning engine regression, run: "npm run test:learning-engine" }
      - { name: Feedback loop regression, run: "npm run test:feedback-loop" }
      - { name: Content workflow regression, run: "npm run test:content-workflow" }
      - { name: Content semantic dedupe regression, run: "npm run test:content-dedupe" }
      - { name: Calendar workflow regression, run: "npm run test:calendar-workflow" }
      - { name: Social integration contract, run: "npm run test:social" }
      - { name: Social metrics contract, run: "npm run test:social-metrics" }
      - { name: Autopilot route contract, run: "npm run test:autopilot-route" }
      - { name: OpenAI text contract, run: "npm run test:openai" }
      - { name: OpenAI image contract, run: "npm run test:openai-image" }
      - { name: Build, run: "npm run build" }
      - { name: Cloudflare dry run, run: "npx wrangler deploy --dry-run" }
      - name: Provision ephemeral admin bootstrap secret
        if: contains(github.event.head_commit.message, '[bootstrap-admin]')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "ADMIN_BOOTSTRAP_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | npx wrangler secret put ADMIN_BOOTSTRAP_TOKEN
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Production application smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://autoposter.02alessandrocaruso.workers.dev"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -L -o production-app.html -w "%{http_code}" -H "accept: text/html" "$base/app/dashboard" || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          APP_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('production-app.html', 'utf8');
          if (process.env.APP_STATUS !== '200' || !/<!doctype html|<html/i.test(html) || html.length < 200) {
            console.error('Production application smoke failed:', JSON.stringify({ status: process.env.APP_STATUS, htmlBytes: html.length }));
            process.exit(1);
          }
          console.log('production application smoke: PASS', JSON.stringify({ status: process.env.APP_STATUS, htmlBytes: html.length }));
          NODE
      - name: Production same-origin Auth proxy smoke
        shell: bash
        run: |
          set -euo pipefail
          base="https://autoposter.02alessandrocaruso.workers.dev"
          session_status=$(curl -sS -D auth-session-headers.txt -o auth-session.json -w "%{http_code}" -H 'accept: application/json' "$base/api/auth/get-session" || true)
          if [ "$session_status" != "200" ]; then
            echo "same-origin get-session failed: HTTP $session_status" >&2
            exit 1
          fi
          if ! tr -d '\r' < auth-session-headers.txt | grep -Eiq '^cache-control:.*no-store'; then
            echo "same-origin get-session missing no-store" >&2
            exit 1
          fi
          foreign_status=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'origin: https://evil.invalid' -H 'content-type: application/json' --data '{}' "$base/api/auth/sign-in/email" || true)
          if [ "$foreign_status" != "403" ]; then
            echo "foreign Origin was not denied: HTTP $foreign_status" >&2
            exit 1
          fi
          override_status=$(curl -sS -o /dev/null -w "%{http_code}" "$base/api/auth/get-session?upstream=https%3A%2F%2Fevil.invalid" || true)
          if [ "$override_status" != "400" ]; then
            echo "Auth upstream override was not denied: HTTP $override_status" >&2
            exit 1
          fi
          echo "production same-origin Auth proxy smoke: PASS"
      - name: Production tenant and owner security audit
        shell: bash
        run: |
          set -euo pipefail
          audit_url="https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -o tenant-audit.json -w "%{http_code}" "$audit_url" || true)
            cat tenant-audit.json || true
            echo
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          AUDIT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('tenant-audit.json', 'utf8'));
          const tenant = payload?.tenantIsolation ?? {};
          const owner = payload?.ownerContract ?? {};
          const valid = process.env.AUDIT_STATUS === '200'
            && payload?.ready === true
            && tenant?.ready === true
            && owner?.ready === true
            && Number(owner.profilesWithoutOwner ?? 1) === 0
            && Number(owner.profilesWithMultipleOwners ?? 1) === 0
            && Number(owner.profilesAuthIdentityUnresolved ?? 1) === 0
            && Number(owner.profilesOwnerUserIdMismatch ?? 1) === 0
            && Number(owner.profilesTotal ?? -1) === Number(owner.profilesWithOwner ?? -2);
          if (!valid) {
            console.error('Production tenant/owner audit failed:', JSON.stringify({ status: process.env.AUDIT_STATUS, tenant, owner }));
            process.exit(1);
          }
          console.log('production tenant/owner audit: PASS', JSON.stringify({ tenant, owner }));
          NODE
      - name: Production Managed Auth capability audit
        shell: bash
        run: |
          set -euo pipefail
          audit_url="https://autoposter.02alessandrocaruso.workers.dev/api/security/managed-auth-capabilities"
          status=""
          for attempt in {1..12}; do
            status=$(curl -sS -o managed-auth.json -w "%{http_code}" "$audit_url" || true)
            cat managed-auth.json || true
            echo
            if [ "$status" = "200" ]; then break; fi
            sleep 5
          done
          AUTH_AUDIT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('managed-auth.json', 'utf8'));
          const managedAuth = payload?.managedAuth ?? {};
          const endpoints = Object.values(managedAuth.endpoints ?? {});
          const valid = process.env.AUTH_AUDIT_STATUS === '200'
            && managedAuth.ready === true
            && managedAuth.coreAuthReachable === true
            && managedAuth.adminPluginActive === true
            && endpoints.every((endpoint) => endpoint?.state !== 'UNSAFE');
          if (!valid) {
            console.error('Production Managed Auth capability audit failed:', JSON.stringify({ status: process.env.AUTH_AUDIT_STATUS, managedAuth }));
            process.exit(1);
          }
          console.log('production managed auth capability audit: PASS', JSON.stringify({ managedAuth }));
          NODE
      - name: Configure initial native SUPER_ADMIN
        if: contains(github.event.head_commit.message, '[bootstrap-admin]')
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o bootstrap.json -w "%{http_code}" -X POST \
            -H "x-bootstrap-token: $ADMIN_BOOTSTRAP_TOKEN_VALUE" \
            "https://autoposter.02alessandrocaruso.workers.dev/api/internal/fase3/bootstrap-super-admin")
          cat bootstrap.json
          echo
          BOOTSTRAP_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('bootstrap.json', 'utf8'));
          if (process.env.BOOTSTRAP_STATUS !== '200' || body?.configured !== true || body?.ownerIdentityCount !== 1) {
            console.error('Initial SUPER_ADMIN bootstrap failed:', JSON.stringify({ status: process.env.BOOTSTRAP_STATUS, body }));
            process.exit(1);
          }
          console.log('initial SUPER_ADMIN bootstrap: PASS', JSON.stringify(body));
          NODE
      - name: Verify native SUPER_ADMIN persisted
        if: contains(github.event.head_commit.message, '[bootstrap-admin]')
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -o admin-state.json "https://autoposter.02alessandrocaruso.workers.dev/api/security/managed-auth-capabilities"
          cat admin-state.json
          echo
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('admin-state.json', 'utf8'));
          const auth = body?.managedAuth ?? {};
          if (Number(auth.nativeAdminUsers ?? 0) < 1 || auth.platformAdminAuditPresent !== true) {
            console.error('Native SUPER_ADMIN persistence verification failed:', JSON.stringify({ nativeAdminUsers: auth.nativeAdminUsers, platformAdminAuditPresent: auth.platformAdminAuditPresent }));
            process.exit(1);
          }
          console.log('native SUPER_ADMIN persistence: PASS', JSON.stringify({ nativeAdminUsers: auth.nativeAdminUsers, platformAdminAuditPresent: auth.platformAdminAuditPresent }));
          NODE
      - name: Remove ephemeral admin bootstrap secret
        if: always() && contains(github.event.head_commit.message, '[bootstrap-admin]')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          printf 'y\n' | npx wrangler secret delete ADMIN_BOOTSTRAP_TOKEN
      - name: Verify bootstrap route closed
        if: contains(github.event.head_commit.message, '[bootstrap-admin]')
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -X POST -o /dev/null -w "%{http_code}" "https://autoposter.02alessandrocaruso.workers.dev/api/internal/fase3/bootstrap-super-admin" || true)
          if [ "$status" != "404" ]; then
            echo "Bootstrap route did not fail closed after secret removal: HTTP $status" >&2
            exit 1
          fi
          echo "bootstrap route closed: PASS"
      - name: Production temporary diagnostic routes absent
        shell: bash
        run: |
          set -euo pipefail
          base="https://autoposter.02alessandrocaruso.workers.dev"
          for path in \
            /api/internal/fase3/qa-control \
            /api/internal/tenant-cross-test \
            /api/internal/tenant-membership-diagnostic \
            /api/internal/tenant-owner-membership-migrate; do
            status=$(curl -sS -X POST -o /dev/null -w "%{http_code}" "$base$path" || true)
            if [ "$status" != "404" ]; then
              echo "Temporary diagnostic route still reachable: $path -> HTTP $status" >&2
              exit 1
            fi
          done
          echo "temporary diagnostic routes: ABSENT"
      - name: Production temporary FASE 3 QA secret absent
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > worker-secrets.json
          node - <<'NODE'
          const fs = require('node:fs');
          const secrets = JSON.parse(fs.readFileSync('worker-secrets.json', 'utf8'));
          const names = Array.isArray(secrets) ? secrets.map((item) => item?.name).filter(Boolean) : [];
          if (names.includes('FASE3_QA_TOKEN')) {
            console.error('Temporary FASE 3 QA secret still exists');
            process.exit(1);
          }
          console.log('temporary FASE 3 QA secret: ABSENT');
          NODE
