name: Audit Viewer CI Privileged Channel Probe

on:
  push:
    branches: [verify/audit-viewer-runtime]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - name: Check existing secret channels without exposing values
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL NEON_API_KEY NEON_PROJECT_ID NEON_DATABASE_URL POSTGRES_URL POSTGRES_URL_NON_POOLING CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!name:-}" ]; then
              echo "$name=CONFIGURED"
            else
              echo "$name=ABSENT"
            fi
          done
      - name: Probe DATABASE_URL binding in temporary Cloudflare remote preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler dev tests/ci-remote-secret-probe.mjs --remote --ip 127.0.0.1 --port 8788 > remote-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          status=""
          for attempt in {1..24}; do
            status=$(curl -sS -o remote-probe.json -w "%{http_code}" http://127.0.0.1:8788/ || true)
            [ "$status" = "200" ] && break
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "REMOTE_PREVIEW=UNAVAILABLE"
            tail -n 30 remote-preview.log || true
            exit 1
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('remote-probe.json', 'utf8'));
          console.log(`REMOTE_DATABASE_URL=${body.databaseUrlPresent === true ? 'CONFIGURED' : 'ABSENT'}`);
          NODE
