name: Audit Viewer CI Privileged Channel Probe

on:
  push:
    branches: [verify/audit-viewer-runtime]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }

      - name: Generate one-time preview token
        shell: bash
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          alias="auditprobe-${GITHUB_RUN_NUMBER}"
          echo "::add-mask::$token"
          echo "AUDIT_SMOKE_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "AUDIT_PREVIEW_ALIAS=$alias" >> "$GITHUB_ENV"
          printf 'AUDIT_SMOKE_TOKEN=%s\n' "$token" > .audit-probe-secrets.env
          chmod 600 .audit-probe-secrets.env

      - name: Upload non-deployed preview version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload \
            --config tests/wrangler.audit-probe.jsonc \
            --keep-vars \
            --preview-alias "$AUDIT_PREVIEW_ALIAS" \
            --secrets-file .audit-probe-secrets.env

      - name: Verify preview inherits production DATABASE_URL without exposing it
        shell: bash
        run: |
          set -euo pipefail
          url="https://${AUDIT_PREVIEW_ALIAS}-autoposter.02alessandrocaruso.workers.dev/"
          wrong=$(curl -sS -o /dev/null -w "%{http_code}" -H 'x-audit-smoke-token: wrong' "$url" || true)
          if [ "$wrong" != "403" ]; then
            echo "PREVIEW_TOKEN_GATE=FAIL HTTP $wrong" >&2
            exit 1
          fi
          status=$(curl -sS -o preview-probe.json -w "%{http_code}" -H "x-audit-smoke-token: $AUDIT_SMOKE_TOKEN_VALUE" "$url")
          PREVIEW_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('preview-probe.json', 'utf8'));
          if (process.env.PREVIEW_STATUS !== '200' || body?.databaseUrlPresent !== true) {
            console.error('PREVIEW_DATABASE_BINDING=FAIL', JSON.stringify({ status: process.env.PREVIEW_STATUS, databaseUrlPresent: body?.databaseUrlPresent === true }));
            process.exit(1);
          }
          console.log('PREVIEW_DATABASE_BINDING=CONFIGURED');
          NODE

      - name: Remove local token material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .audit-probe-secrets.env ]; then
            chmod 600 .audit-probe-secrets.env || true
            shred -u .audit-probe-secrets.env 2>/dev/null || rm -f .audit-probe-secrets.env
          fi
          rm -f preview-probe.json
