name: Video Studio branch checks
on:
  push:
    branches: [feature/ai-video-editor-plan]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Video Studio unit tests
        run: |
          npx tsx tests/video-studio.test.ts
          npx tsx tests/video-editorial-calendar.test.ts
          npx tsx tests/video-studio-readiness.test.ts
          npx tsx tests/abekyo-local-adapter.test.ts
          npx tsx tests/video-studio-integration.test.ts
          npx tsx tests/video-publication-gate.test.ts
          npx tsx tests/video-image-generator.test.ts
      - name: FFmpeg renderer smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 - <<'PY'
          import json
          plan={"format":"REEL_9_16","width":1080,"height":1920,"fps":30,"scenes":[{"startMs":0,"endMs":1000,"overlay":"Test video"}]}
          with open("/tmp/storyboard.json","w") as f: json.dump(plan,f)
          PY
          python3 scripts/render-video-studio.py /tmp/storyboard.json /tmp/autoposter-test.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/autoposter-test.mp4 | grep -qx '1080,1920'
      - name: Scene asset MP4 smoke test
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=blue:s=720x1280 -frames:v 1 /tmp/scene1.png
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=green:s=720x1280 -frames:v 1 /tmp/scene2.png
          python3 - <<'PY'
          import json
          json.dump({"format":"REEL_9_16","width":1080,"height":1920,"fps":30,"scenes":[{"id":"scene-1","startMs":0,"endMs":1000},{"id":"scene-2","startMs":1000,"endMs":2000}]},open("/tmp/asset-plan.json","w"))
          json.dump({"scene-1":"/tmp/scene1.png","scene-2":"/tmp/scene2.png"},open("/tmp/asset-manifest.json","w"))
          PY
          python3 scripts/render-video-assets.py /tmp/asset-plan.json /tmp/asset-manifest.json /tmp/asset-reel.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 /tmp/asset-reel.mp4 | grep -qx '1080,1920'
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
