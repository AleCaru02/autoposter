name: runtime

on:
  push:
    branches:
      - feat/saas-foundation
    paths:
      - 'packages/runtime/**'
      - 'packages/contracts/src/**'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'packages/runtime/**'
      - 'packages/contracts/src/**'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: packages/runtime
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: packages/runtime
        run: npm run typecheck
      - name: Test
        working-directory: packages/runtime
        run: npm test
