name: runtime

on:
  push:
    branches:
      - feat/saas-foundation
    paths:
      - 'package.json'
      - 'packages/runtime/**'
      - 'packages/contracts/**'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'packages/runtime/**'
      - 'packages/contracts/**'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck runtime
        run: npm run typecheck --workspace=@socialpilot/runtime
      - name: Test runtime
        run: npm test --workspace=@socialpilot/runtime
