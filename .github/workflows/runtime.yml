name: runtime

on:
  push:
    branches:
      - feat/saas-foundation
    paths:
      - 'package.json'
      - 'scripts/check-provider-readiness.mjs'
      - 'packages/runtime/**'
      - 'packages/contracts/**'
      - '.github/workflows/runtime.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'scripts/check-provider-readiness.mjs'
      - 'packages/runtime/**'
      - 'packages/contracts/**'
      - '.github/workflows/runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck runtime
        run: npm run typecheck --workspace=@socialpilot/runtime
      - name: Test runtime
        run: npm test --workspace=@socialpilot/runtime
      - name: Public HTTP website scanner smoke
        env:
          RUN_LIVE_WEBSITE_SMOKE: 'true'
        working-directory: packages/runtime
        run: npx vitest run tests/website-scanner-live.test.ts
      - name: Check provider readiness without live credentials
        run: npm run check-provider-readiness
