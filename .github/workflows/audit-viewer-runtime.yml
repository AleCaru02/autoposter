name: Audit Viewer Authenticated Runtime

on:
  workflow_dispatch:

concurrency:
  group: same-origin-auth-cookie-feasibility
  cancel-in-progress: false

jobs:
  runtime:
    name: same-origin-auth-cookie-feasibility
    if: github.ref == 'refs/heads/verify/same-origin-auth-cookie-feasibility'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }
      - name: Static safety gate
        run: |
          npm run typecheck
          npm run test:auth-security
          npm run test:platform-rbac
          npm run test:fase3-core
          npm run test:admin-audit-viewer
          npm run test:admin-session-management
          npm run test:admin-session-ui
          npm run test:admin-ban-unban
          npm run test:admin-ban-unban-ui
          npm run test:banned-user-rls
          npm run test:tenant-security
          npm run test:tenant-cross-security
          node --check tests/same-origin-auth-feasibility-worker.mjs
          node --check tests/same-origin-auth-feasibility-browser.mjs
          node tests/same-origin-auth-feasibility-static.test.mjs
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Generate ephemeral feasibility material
        shell: bash
        run: |
          set -euo pipefail
          marker="${GITHUB_RUN_ID}"
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          alias="authprobe-${GITHUB_RUN_ID}"
          email="audit-smoke-${marker}-customer@example.invalid"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "::add-mask::$email"
          echo "AUTH_FEASIBILITY_MARKER=$marker" >> "$GITHUB_ENV"
          echo "AUTH_FEASIBILITY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "AUTH_FEASIBILITY_PREVIEW_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "AUTH_FEASIBILITY_BASE=https://${alias}-autoposter.02alessandrocaruso.workers.dev" >> "$GITHUB_ENV"
          echo "AUTH_FEASIBILITY_CONTROL=https://${alias}-autoposter.02alessandrocaruso.workers.dev/__qa/control" >> "$GITHUB_ENV"
          echo "AUDIT_SMOKE_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          printf 'AUDIT_SMOKE_TOKEN=%s\n' "$token" > .auth-feasibility-secrets.env
          chmod 600 .auth-feasibility-secrets.env
      - name: Upload feasibility Worker as non-deployed preview version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload --config tests/wrangler.auth-feasibility.jsonc --keep-vars --preview-alias "$AUTH_FEASIBILITY_PREVIEW_ALIAS" --secrets-file .auth-feasibility-secrets.env | tee auth-feasibility-upload.log
          version_id=$(sed -n 's/^Worker Version ID: \([0-9a-fA-F-]*\)$/\1/p' auth-feasibility-upload.log | tail -n 1)
          if ! printf '%s' "$version_id" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}$'; then echo "preview version id not captured" >&2; exit 1; fi
          echo "AUTH_FEASIBILITY_VERSION_ID=$version_id" >> "$GITHUB_ENV"
      - name: Verify Preview isolation and capture production baseline
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o auth-feasibility-deployments-before.json
          node - <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('auth-feasibility-deployments-before.json','utf8'));
          if(body?.success!==true)throw new Error('Cloudflare deployment read failed');
          const result=body.result;
          const deployments=Array.isArray(result?.deployments)?result.deployments:Array.isArray(result)?result:[];
          if(!deployments.length)throw new Error('no production deployments returned');
          const deploymentIds=deployments.map(i=>String(i.id||'')).filter(Boolean).sort();
          const versionIds=[...new Set(deployments.flatMap(i=>Array.isArray(i.versions)?i.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          const ephemeral=process.env.AUTH_FEASIBILITY_VERSION_ID||'';
          if(versionIds.includes(ephemeral))throw new Error('feasibility version attached to production');
          fs.appendFileSync(process.env.GITHUB_ENV,`AUTH_FEASIBILITY_PROD_DEPLOYMENTS=${deploymentIds.join(',')}\nAUTH_FEASIBILITY_PROD_VERSIONS=${versionIds.join(',')}\n`);
          console.log('SAME_ORIGIN_AUTH_PREVIEW_ISOLATION: PASS',JSON.stringify({attachedToProduction:false}));
          NODE
      - name: Feasibility preflight
        shell: bash
        run: |
          set -euo pipefail
          wrong=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' -H 'x-audit-smoke-token: wrong' --data "{\"action\":\"preflight\",\"marker\":\"$AUTH_FEASIBILITY_MARKER\"}" "$AUTH_FEASIBILITY_CONTROL" || true)
          if [ "$wrong" != "403" ]; then echo "preview token gate failed HTTP $wrong" >&2; exit 1; fi
          status=$(curl -sS -o auth-feasibility-preflight.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-audit-smoke-token: $AUDIT_SMOKE_TOKEN_VALUE" --data "{\"action\":\"preflight\",\"marker\":\"$AUTH_FEASIBILITY_MARKER\"}" "$AUTH_FEASIBILITY_CONTROL")
          PREFLIGHT_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync('auth-feasibility-preflight.json','utf8'));
          if(process.env.PREFLIGHT_STATUS!=='200')throw new Error('preflight HTTP '+process.env.PREFLIGHT_STATUS);
          for(const k of ['qaUsers','qaProfiles','qaOwners','qaAppUsers','qaSessions','qaAccounts','qaAdmins'])if(b[k]!==0)throw new Error(`preflight residue ${k}=${b[k]}`);
          if(b.superAdmins!==1)throw new Error(`real SUPER_ADMIN baseline ${b.superAdmins}`);
          if(b.profilesWithoutOwner!==0)throw new Error(`profilesWithoutOwner baseline ${b.profilesWithoutOwner}`);
          fs.appendFileSync(process.env.GITHUB_ENV,`AUTH_FEASIBILITY_BASELINE_PROFILES=${b.profilesTotal}\nAUTH_FEASIBILITY_CONTROLLER_READY=true\n`);
          console.log('SAME_ORIGIN_AUTH_FEASIBILITY_PREFLIGHT: PASS',JSON.stringify({superAdmins:b.superAdmins,profilesTotal:b.profilesTotal,profilesWithoutOwner:b.profilesWithoutOwner}));
          NODE
      - name: Browser cookie feasibility runtime
        run: node tests/same-origin-auth-feasibility-browser.mjs
      - name: Cleanup feasibility identity and data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AUTH_FEASIBILITY_CONTROLLER_READY:-}" != "true" ]; then echo "CLEANUP_CONTROLLER_NOT_READY"; exit 0; fi
          status=$(curl -sS -o auth-feasibility-cleanup.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-audit-smoke-token: $AUDIT_SMOKE_TOKEN_VALUE" --data "{\"action\":\"cleanup\",\"marker\":\"$AUTH_FEASIBILITY_MARKER\"}" "$AUTH_FEASIBILITY_CONTROL" || true)
          CLEANUP_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync('auth-feasibility-cleanup.json','utf8'));
          if(process.env.CLEANUP_STATUS!=='200'||b.cleaned!==true)throw new Error('cleanup failed');
          for(const k of ['qaUsers','qaProfiles','qaOwners','qaAppUsers','qaSessions','qaAccounts','qaAdmins','qaAuditRows'])if(b[k]!==0)throw new Error(`cleanup residue ${k}=${b[k]}`);
          if(b.superAdmins!==1)throw new Error(`post-cleanup SUPER_ADMIN ${b.superAdmins}`);
          if(b.profilesWithoutOwner!==0)throw new Error(`post-cleanup profilesWithoutOwner ${b.profilesWithoutOwner}`);
          if(String(b.profilesTotal)!==String(process.env.AUTH_FEASIBILITY_BASELINE_PROFILES))throw new Error('profiles baseline mismatch');
          console.log('SAME_ORIGIN_AUTH_FEASIBILITY_CLEANUP: PASS',JSON.stringify({qaUsers:0,qaProfiles:0,qaOwners:0,qaSessions:0,qaAdmins:0,superAdmins:b.superAdmins,profilesTotal:b.profilesTotal,profilesWithoutOwner:b.profilesWithoutOwner}));
          NODE
      - name: Post-cleanup production deployment invariant
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o auth-feasibility-deployments-after.json
          node - <<'NODE'
          const fs=require('node:fs');
          const cf=JSON.parse(fs.readFileSync('auth-feasibility-deployments-after.json','utf8'));
          if(cf?.success!==true)throw new Error('Cloudflare deployment read failed');
          const result=cf.result;
          const deployments=Array.isArray(result?.deployments)?result.deployments:Array.isArray(result)?result:[];
          const deploymentIds=deployments.map(i=>String(i.id||'')).filter(Boolean).sort();
          const versionIds=[...new Set(deployments.flatMap(i=>Array.isArray(i.versions)?i.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          const beforeD=String(process.env.AUTH_FEASIBILITY_PROD_DEPLOYMENTS||'').split(',').filter(Boolean).sort();
          const beforeV=String(process.env.AUTH_FEASIBILITY_PROD_VERSIONS||'').split(',').filter(Boolean).sort();
          if(JSON.stringify(deploymentIds)!==JSON.stringify(beforeD)||JSON.stringify(versionIds)!==JSON.stringify(beforeV))throw new Error('production deployment set changed during feasibility probe');
          if(versionIds.includes(process.env.AUTH_FEASIBILITY_VERSION_ID||''))throw new Error('feasibility version attached to production');
          console.log('SAME_ORIGIN_AUTH_FEASIBILITY_PRODUCTION_INVARIANT: PASS',JSON.stringify({attachedToProduction:false,deploymentUnchanged:true}));
          NODE
      - name: Remove local ephemeral credential material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .auth-feasibility-secrets.env ]; then chmod 600 .auth-feasibility-secrets.env || true; shred -u .auth-feasibility-secrets.env 2>/dev/null || rm -f .auth-feasibility-secrets.env; fi
          rm -f auth-feasibility-preflight.json auth-feasibility-cleanup.json auth-feasibility-upload.log auth-feasibility-deployments-before.json auth-feasibility-deployments-after.json
          echo "SAME_ORIGIN_AUTH_FEASIBILITY_EPHEMERAL_SECRET_CLEANUP: PASS"
