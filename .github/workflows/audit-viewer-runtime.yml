name: Audit Viewer Authenticated Runtime

on:
  workflow_dispatch:

concurrency:
  group: audit-viewer-authenticated-runtime
  cancel-in-progress: false

jobs:
  runtime:
    name: banned-user-rls-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }

      - name: Static security gate
        run: |
          npm run typecheck
          npm run test:banned-user-rls
          npm run test:tenant-security
          npm run test:tenant-cross-security
          npm run test:platform-rbac
          npm run test:fase3-core
          npm run test:admin-session-management
          npm run test:audit-runtime-static

      - name: Generate ephemeral smoke identity material
        shell: bash
        run: |
          set -euo pipefail
          marker="${GITHUB_RUN_ID}"
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          alias="auditqa-${GITHUB_RUN_ID}"
          customer_email="audit-smoke-${marker}-customer@example.invalid"
          customer_b_email="audit-smoke-${marker}-customer-b@example.invalid"
          admin_email="audit-smoke-${marker}-admin@example.invalid"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "::add-mask::$customer_email"
          echo "::add-mask::$customer_b_email"
          echo "::add-mask::$admin_email"
          echo "AUDIT_SMOKE_MARKER=$marker" >> "$GITHUB_ENV"
          echo "AUDIT_SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "AUDIT_SMOKE_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "AUDIT_PREVIEW_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "AUDIT_SMOKE_CONTROLLER_URL=https://${alias}-autoposter.02alessandrocaruso.workers.dev/" >> "$GITHUB_ENV"
          printf 'AUDIT_SMOKE_TOKEN=%s\n' "$token" > .audit-runtime-secrets.env
          chmod 600 .audit-runtime-secrets.env

      - name: Upload fixed-scope controller as non-deployed Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload \
            --config tests/wrangler.audit-runtime.jsonc \
            --keep-vars \
            --preview-alias "$AUDIT_PREVIEW_ALIAS" \
            --secrets-file .audit-runtime-secrets.env | tee audit-upload.log
          version_id=$(sed -n 's/^Worker Version ID: \([0-9a-fA-F-]*\)$/\1/p' audit-upload.log | tail -n 1)
          if ! printf '%s' "$version_id" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}$'; then
            echo "preview version id not captured" >&2
            exit 1
          fi
          echo "EPHEMERAL_CONTROLLER_VERSION_ID=$version_id" >> "$GITHUB_ENV"
          echo "AUDIT_PREVIEW_UPLOADED=true" >> "$GITHUB_ENV"

      - name: Verify preview version is isolated from production deployments
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" \
            -o audit-deployments-before.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('audit-deployments-before.json', 'utf8'));
          if (body?.success !== true) throw new Error('Cloudflare deployment read failed');
          const result = body.result;
          const deployments = Array.isArray(result?.deployments) ? result.deployments : Array.isArray(result) ? result : [];
          if (deployments.length === 0) throw new Error('no production deployments returned');
          const deploymentIds = deployments.map((item) => String(item.id || '')).filter(Boolean).sort();
          const versionIds = [...new Set(deployments.flatMap((item) => Array.isArray(item.versions) ? item.versions.map((version) => String(version.version_id || '')) : []).filter(Boolean))].sort();
          const ephemeral = process.env.EPHEMERAL_CONTROLLER_VERSION_ID || '';
          if (!ephemeral) throw new Error('ephemeral controller version missing');
          if (versionIds.includes(ephemeral)) throw new Error('ephemeral controller version is attached to a production deployment');
          fs.appendFileSync(process.env.GITHUB_ENV, `AUDIT_PRODUCTION_DEPLOYMENT_IDS=${deploymentIds.join(',')}\nAUDIT_PRODUCTION_VERSION_IDS=${versionIds.join(',')}\n`);
          console.log('AUDIT_PREVIEW_ISOLATION: PASS', JSON.stringify({ attachedToProduction: false }));
          NODE

      - name: Preview controller preflight and stale QA recovery
        shell: bash
        run: |
          set -euo pipefail
          wrong=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H 'content-type: application/json' -H 'x-audit-smoke-token: wrong' \
            --data "{\"action\":\"preflight\",\"marker\":\"$AUDIT_SMOKE_MARKER\"}" \
            "$AUDIT_SMOKE_CONTROLLER_URL" || true)
          if [ "$wrong" != "403" ]; then
            echo "preview token gate failed: HTTP $wrong" >&2
            exit 1
          fi
          read_preflight() {
            curl -sS -o audit-preflight.json -w "%{http_code}" -X POST \
              -H 'content-type: application/json' -H "x-audit-smoke-token: $AUDIT_SMOKE_TOKEN_VALUE" \
              --data "{\"action\":\"preflight\",\"marker\":\"$AUDIT_SMOKE_MARKER\"}" \
              "$AUDIT_SMOKE_CONTROLLER_URL"
          }
          status=$(read_preflight)
          if [ "$status" != "200" ]; then echo "preview preflight failed HTTP $status" >&2; exit 1; fi
          stale=$(node -e "const b=require('./audit-preflight.json'); process.stdout.write(String(Number(b.recognizedQaUsers||0)))")
          if [ "$stale" -gt 0 ]; then
            cleanup_status=$(curl -sS -o audit-stale-cleanup.json -w "%{http_code}" -X POST \
              -H 'content-type: application/json' -H "x-audit-smoke-token: $AUDIT_SMOKE_TOKEN_VALUE" \
              --data "{\"action\":\"cleanup-residue\",\"marker\":\"$AUDIT_SMOKE_MARKER\"}" \
              "$AUDIT_SMOKE_CONTROLLER_URL")
            CLEANUP_STATUS="$cleanup_status" node -e "const b=require('./audit-stale-cleanup.json'); if(process.env.CLEANUP_STATUS!=='200'||b.cleaned!==true||b.recognizedQaUsers!==0||b.recognizedQaAdmins!==0) throw new Error('stale verifier cleanup failed');"
            status=$(read_preflight)
          fi
          PREFLIGHT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('audit-preflight.json','utf8'));
          if (process.env.PREFLIGHT_STATUS !== '200') throw new Error(`preflight HTTP ${process.env.PREFLIGHT_STATUS}`);
          for (const key of ['qaUsers','qaProfiles','qaOwners','qaAppUsers','qaSessions','qaAccounts','qaAdmins','recognizedQaUsers','recognizedQaAdmins']) if (body[key] !== 0) throw new Error(`preflight residue ${key}=${body[key]}`);
          if (body.superAdmins !== 1) throw new Error(`real SUPER_ADMIN baseline ${body.superAdmins}`);
          if (body.profilesWithoutOwner !== 0 || body.profilesMultipleOwners !== 0 || body.ownerAuthMismatches !== 0) throw new Error('OWNER baseline invariant failed');
          fs.appendFileSync(process.env.GITHUB_ENV, `AUDIT_BASELINE_PROFILES=${body.profilesTotal}\nCONTROLLER_READY=true\n`);
          console.log('BANNED_RLS_PREFLIGHT: PASS', JSON.stringify({ superAdmins: body.superAdmins, profilesTotal: body.profilesTotal, profilesWithoutOwner: body.profilesWithoutOwner }));
          NODE

      - name: Apply versioned banned-user RLS migrations
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o banned-rls-apply.json -w "%{http_code}" -X POST \
            -H 'content-type: application/json' -H "x-audit-smoke-token: $AUDIT_SMOKE_TOKEN_VALUE" \
            --data "{\"action\":\"apply-banned-rls\",\"marker\":\"$AUDIT_SMOKE_MARKER\"}" \
            "$AUDIT_SMOKE_CONTROLLER_URL")
          APPLY_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('banned-rls-apply.json','utf8'));
          if(process.env.APPLY_STATUS!=='200'||body.applied!==true) throw new Error(`banned RLS migration apply failed HTTP ${process.env.APPLY_STATUS}`);
          if(body.tenantTables!==17||body.rlsEnabled!==17||body.restrictiveBarriers!==17||body.activeBarrierTables!==17) throw new Error(`banned RLS migration postcondition failed ${JSON.stringify(body)}`);
          console.log('BANNED_RLS_MIGRATION_APPLY: PASS', JSON.stringify(body));
          NODE

      - name: Pre-ban JWT Data API security runtime
        run: node tests/banned-user-rls-runtime.mjs

      - name: Production RLS and OWNER audit after runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit -o tenant-audit-runtime.json
          node - <<'NODE'
          const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('tenant-audit-runtime.json','utf8'));
          const tenant=body?.tenantIsolation||{}; const owner=body?.ownerContract||{};
          if(body?.ready!==true||tenant.ready!==true||owner.ready!==true) throw new Error('production tenant/OWNER audit not ready');
          if(tenant.expectedTables!==17||tenant.existingTables!==17||tenant.rlsEnabledTables!==17||tenant.authBarrierTables!==17||tenant.openPolicies!==0||tenant.anonymousPrivilegedTables!==0) throw new Error(`RLS invariant failed ${JSON.stringify(tenant)}`);
          if(owner.profilesWithoutOwner!==0||owner.profilesWithMultipleOwners!==0||owner.profilesAuthIdentityUnresolved!==0||owner.profilesOwnerUserIdMismatch!==0) throw new Error(`OWNER invariant failed ${JSON.stringify(owner)}`);
          console.log('BANNED_RLS_PRODUCTION_AUDIT: PASS', JSON.stringify({ tenantTables:tenant.existingTables, rls:tenant.rlsEnabledTables, authBarrier:tenant.authBarrierTables, openPolicies:tenant.openPolicies, anonymousPrivilegedTables:tenant.anonymousPrivilegedTables, profilesWithoutOwner:owner.profilesWithoutOwner }));
          NODE

      - name: Cleanup ephemeral smoke identities and data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CONTROLLER_READY:-}" != "true" ]; then echo "CLEANUP_CONTROLLER_NOT_READY"; exit 0; fi
          status=$(curl -sS -o audit-cleanup.json -w "%{http_code}" -X POST \
            -H 'content-type: application/json' -H "x-audit-smoke-token: $AUDIT_SMOKE_TOKEN_VALUE" \
            --data "{\"action\":\"cleanup\",\"marker\":\"$AUDIT_SMOKE_MARKER\"}" \
            "$AUDIT_SMOKE_CONTROLLER_URL" || true)
          CLEANUP_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs'); const body=JSON.parse(fs.readFileSync('audit-cleanup.json','utf8'));
          if(process.env.CLEANUP_STATUS!=='200'||body.cleaned!==true) throw new Error(`cleanup failed HTTP ${process.env.CLEANUP_STATUS}`);
          for(const key of ['qaUsers','qaProfiles','qaOwners','qaAppUsers','qaSessions','qaAccounts','qaAdmins']) if(body[key]!==0) throw new Error(`cleanup residue ${key}=${body[key]}`);
          if(body.superAdmins!==1) throw new Error(`post-cleanup SUPER_ADMIN ${body.superAdmins}`);
          if(body.profilesWithoutOwner!==0||body.profilesMultipleOwners!==0||body.ownerAuthMismatches!==0) throw new Error('post-cleanup OWNER invariant failed');
          if(String(body.profilesTotal)!==String(process.env.AUDIT_BASELINE_PROFILES)) throw new Error(`profiles baseline mismatch ${body.profilesTotal} != ${process.env.AUDIT_BASELINE_PROFILES}`);
          console.log('BANNED_RLS_CLEANUP: PASS', JSON.stringify({ qaUsers:0, qaProfiles:0, qaOwners:0, qaSessions:0, qaAdmins:0, superAdmins:body.superAdmins, profilesTotal:body.profilesTotal, profilesWithoutOwner:body.profilesWithoutOwner }));
          NODE

      - name: Post-cleanup production and deployment invariants
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit -o tenant-audit.json
          curl -fsS https://autoposter.02alessandrocaruso.workers.dev/api/security/managed-auth-capabilities -o auth-audit.json
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" \
            -o audit-deployments-after.json
          node - <<'NODE'
          const fs=require('node:fs');
          const tenant=JSON.parse(fs.readFileSync('tenant-audit.json','utf8'));
          const auth=JSON.parse(fs.readFileSync('auth-audit.json','utf8'));
          const cloudflare=JSON.parse(fs.readFileSync('audit-deployments-after.json','utf8'));
          if(tenant?.ready!==true||tenant?.ownerContract?.ready!==true||tenant.ownerContract.profilesWithoutOwner!==0) throw new Error('production tenant/OWNER invariant not ready');
          if(auth?.managedAuth?.ready!==true||auth.managedAuth.nativeAdminUsers!==1) throw new Error(`production native SUPER_ADMIN count ${auth?.managedAuth?.nativeAdminUsers}`);
          if(process.env.AUDIT_BASELINE_PROFILES&&String(tenant.ownerContract.profilesTotal)!==String(process.env.AUDIT_BASELINE_PROFILES)) throw new Error('production profile baseline mismatch');
          if(cloudflare?.success!==true) throw new Error('Cloudflare post-runtime deployment read failed');
          const result=cloudflare.result; const deployments=Array.isArray(result?.deployments)?result.deployments:Array.isArray(result)?result:[];
          const deploymentIds=deployments.map((item)=>String(item.id||'')).filter(Boolean).sort();
          const versionIds=[...new Set(deployments.flatMap((item)=>Array.isArray(item.versions)?item.versions.map((version)=>String(version.version_id||'')):[]).filter(Boolean))].sort();
          const beforeDeployments=String(process.env.AUDIT_PRODUCTION_DEPLOYMENT_IDS||'').split(',').filter(Boolean).sort();
          const beforeVersions=String(process.env.AUDIT_PRODUCTION_VERSION_IDS||'').split(',').filter(Boolean).sort();
          if(JSON.stringify(deploymentIds)!==JSON.stringify(beforeDeployments)) throw new Error('production deployment set changed during Audit runtime');
          if(JSON.stringify(versionIds)!==JSON.stringify(beforeVersions)) throw new Error('production deployment version set changed during Audit runtime');
          if(versionIds.includes(process.env.EPHEMERAL_CONTROLLER_VERSION_ID||'')) throw new Error('ephemeral controller became attached to production');
          console.log('BANNED_RLS_POST_CLEANUP_PRODUCTION: PASS', JSON.stringify({ nativeAdminUsers:auth.managedAuth.nativeAdminUsers, profilesTotal:tenant.ownerContract.profilesTotal, profilesWithoutOwner:tenant.ownerContract.profilesWithoutOwner, attachedToProduction:false }));
          NODE

      - name: Remove local ephemeral credential material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .audit-runtime-secrets.env ]; then
            chmod 600 .audit-runtime-secrets.env || true
            shred -u .audit-runtime-secrets.env 2>/dev/null || rm -f .audit-runtime-secrets.env
          fi
          rm -f audit-preflight.json audit-stale-cleanup.json audit-cleanup.json banned-rls-apply.json tenant-audit-runtime.json tenant-audit.json auth-audit.json audit-upload.log audit-deployments-before.json audit-deployments-after.json
          echo "BANNED_RLS_EPHEMERAL_SECRET_CLEANUP: PASS"