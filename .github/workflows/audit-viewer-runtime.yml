name: Audit Viewer Authenticated Runtime

on:
  workflow_dispatch:

concurrency:
  group: audit-viewer-authenticated-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected verifier ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Pin production base and verifier-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected="f0abee9eb7f881c8a5d24993c9c9eee23d0937e2"
          if [ "$GITHUB_REF_NAME" != "verify/fase4f-provider-budget-runtime" ]; then echo "RUNTIME_VERIFIER_NOT_CERTIFIED: wrong branch $GITHUB_REF_NAME" >&2; exit 1; fi
          merge_base=$(git merge-base HEAD "$expected")
          if [ "$merge_base" != "$expected" ]; then echo "RUNTIME_VERIFIER_NOT_CERTIFIED: production base mismatch $merge_base" >&2; exit 1; fi
          changed=$(git diff --name-only "$expected"...HEAD)
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/audit-viewer-runtime.yml|.github/workflows/gate.yml|tests/audit-viewer-runtime-static.test.mjs|tests/provider-cost-budget-runtime*|tests/provider-cost-budget-qa-controller.ts|tests/wrangler.provider-cost-runtime.jsonc) ;;
              *) echo "RUNTIME_VERIFIER_NOT_CERTIFIED: product diff detected: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo "FASE 4F verifier scope: PASS"

      - name: Static pre-certification gate
        run: |
          npm run typecheck
          npm run test:entitlements
          npm run test:entitlement-migration
          npm run test:plan-packages
          npm run test:provider-cost-budget
          node tests/provider-cost-budget-runtime-static.test.mjs
          npm run test:tenant-security
          npm run test:tenant-cross-security
          npm run build
          npx wrangler versions upload --dry-run --config tests/wrangler.provider-cost-runtime.jsonc

      - name: Generate ephemeral provider-cost QA material
        shell: bash
        run: |
          set -euo pipefail
          marker="${GITHUB_RUN_ID}"
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          alias="costqa-${GITHUB_RUN_ID}"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "PROVIDER_COST_QA_MARKER=$marker" >> "$GITHUB_ENV"
          echo "PROVIDER_COST_QA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PROVIDER_COST_QA_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "PROVIDER_COST_PREVIEW_URL=https://${alias}-autoposter.02alessandrocaruso.workers.dev" >> "$GITHUB_ENV"
          printf 'PROVIDER_COST_QA_TOKEN=%s\n' "$token" > .provider-cost-runtime-secrets.env
          chmod 600 .provider-cost-runtime-secrets.env

      - name: Upload verifier as isolated Preview version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          alias="costqa-${GITHUB_RUN_ID}"
          npx wrangler versions upload --config tests/wrangler.provider-cost-runtime.jsonc --keep-vars --preview-alias "$alias" --secrets-file .provider-cost-runtime-secrets.env | tee provider-cost-upload.log
          version_id=$(sed -n 's/^Worker Version ID: \([0-9a-fA-F-]*\)$/\1/p' provider-cost-upload.log | tail -n 1)
          printf '%s' "$version_id" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}$'
          echo "PROVIDER_COST_PREVIEW_VERSION_ID=$version_id" >> "$GITHUB_ENV"
          shred -u .provider-cost-runtime-secrets.env 2>/dev/null || rm -f .provider-cost-runtime-secrets.env

      - name: Verify Preview isolation from production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o provider-cost-deployments-before.json
          node - <<'NODE'
          const fs=require('node:fs');const body=JSON.parse(fs.readFileSync('provider-cost-deployments-before.json','utf8'));
          if(body?.success!==true) throw new Error('Cloudflare deployment read failed');
          const source=Array.isArray(body.result?.deployments)?body.result.deployments:Array.isArray(body.result)?body.result:[];
          if(!source.length) throw new Error('no production deployments returned');
          const deployments=source.map(x=>String(x.id||'')).filter(Boolean).sort();
          const versions=[...new Set(source.flatMap(x=>Array.isArray(x.versions)?x.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          if(versions.includes(process.env.PROVIDER_COST_PREVIEW_VERSION_ID||'')) throw new Error('Preview attached to production');
          fs.appendFileSync(process.env.GITHUB_ENV,`PROVIDER_COST_PRODUCTION_DEPLOYMENTS=${deployments.join(',')}\nPROVIDER_COST_PRODUCTION_VERSIONS=${versions.join(',')}\n`);
          console.log('PROVIDER_COST_PREVIEW_ISOLATION: PASS',JSON.stringify({productionVersions:versions,previewAttached:false}));
          NODE

      - name: Preflight and stale QA recovery
        shell: bash
        run: |
          set -euo pipefail
          call_controller() {
            local action="$1" output="$2"
            curl -sS -o "$output" -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-provider-cost-qa-token: $PROVIDER_COST_QA_TOKEN_VALUE" --data "{\"action\":\"$action\",\"marker\":\"$PROVIDER_COST_QA_MARKER\"}" "$PROVIDER_COST_PREVIEW_URL"
          }
          wrong=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' -H 'x-provider-cost-qa-token: wrong' --data "{\"action\":\"preflight\",\"marker\":\"$PROVIDER_COST_QA_MARKER\"}" "$PROVIDER_COST_PREVIEW_URL" || true)
          [ "$wrong" = "403" ] || { echo "Preview token gate failed: $wrong" >&2; exit 1; }
          status=$(call_controller preflight provider-cost-preflight.json)
          [ "$status" = "200" ] || { echo "preflight failed: $status" >&2; exit 1; }
          stale=$(node -e "const b=require('./provider-cost-preflight.json');process.stdout.write(String(Number(b.recognizedQaUsers||0)+Number(b.recognizedQaAudit||0)))")
          if [ "$stale" -gt 0 ]; then cleanup=$(call_controller cleanup-residue provider-cost-stale-cleanup.json); [ "$cleanup" = "200" ] || exit 1; status=$(call_controller preflight provider-cost-preflight.json); fi
          PREFLIGHT_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('provider-cost-preflight.json','utf8'));
          if(process.env.PREFLIGHT_STATUS!=='200') throw new Error('preflight HTTP failure');
          for(const k of ['qaUsers','recognizedQaUsers','qaProfiles','qaAssignments','qaEntitlements','qaUsageEvents','qaUsageBuckets','qaAttempts','qaAiEvents','qaAudit','recognizedQaAudit']) if(b[k]!==0) throw new Error(`residue ${k}=${b[k]}`);
          if(b.packageLifecycle!=='ACTIVE'||b.packageCap!==5||b.attemptRlsForced!==true||b.authenticatedAttemptSelect!==false||b.authenticatedBudgetExecute!==false) throw new Error('provider budget security baseline failed');
          fs.appendFileSync(process.env.GITHUB_ENV,`PROVIDER_COST_BASELINE_PROFILES=${b.profilesTotal}\nPROVIDER_COST_CONTROLLER_READY=true\n`);
          console.log('PROVIDER_COST_PREFLIGHT: PASS',JSON.stringify({profiles:b.profilesTotal,packageLifecycle:b.packageLifecycle,packageCap:b.packageCap}));
          NODE

      - name: FASE 4F authenticated runtime
        run: node tests/provider-cost-budget-runtime.mjs | tee provider-cost-runtime-output.log

      - name: Sensitive output scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=""
          for f in provider-cost-runtime-output.log provider-cost-upload.log provider-cost-preflight.json provider-cost-stale-cleanup.json; do [ -f "$f" ] && files="$files $f"; done
          if [ -n "$files" ] && grep -Eini '(sk-[A-Za-z0-9_-]{16,}|postgres(ql)?://[^[:space:]]+|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|Set-Cookie:|Cookie:|PROVIDER_COST_QA_(TOKEN_VALUE|PASSWORD)=|DATABASE_URL=)' $files > provider-cost-sensitive-findings.txt; then cat provider-cost-sensitive-findings.txt >&2; exit 1; fi
          echo "sensitiveFindings=0"

      - name: Cleanup provider-cost QA fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${PROVIDER_COST_CONTROLLER_READY:-}" != "true" ]; then echo "PROVIDER_COST_CLEANUP_NOT_ARMED"; exit 0; fi
          status=$(curl -sS -o provider-cost-cleanup.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-provider-cost-qa-token: $PROVIDER_COST_QA_TOKEN_VALUE" --data "{\"action\":\"cleanup\",\"marker\":\"$PROVIDER_COST_QA_MARKER\"}" "$PROVIDER_COST_PREVIEW_URL" || true)
          CLEANUP_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('provider-cost-cleanup.json','utf8'));
          if(process.env.CLEANUP_STATUS!=='200'||b.cleaned!==true) throw new Error('cleanup failed');
          for(const k of ['qaUsers','qaProfiles','qaAssignments','qaEntitlements','qaUsageEvents','qaUsageBuckets','qaAttempts','qaAiEvents','qaAudit']) if(b[k]!==0) throw new Error(`cleanup residue ${k}=${b[k]}`);
          if(b.recognizedQaUsers!==0||b.recognizedQaAudit!==0) throw new Error('recognized QA residue remains');
          if(String(b.profilesTotal)!==String(process.env.PROVIDER_COST_BASELINE_PROFILES)) throw new Error('profile baseline mismatch');
          console.log('PROVIDER_COST_CLEANUP: PASS',JSON.stringify({profiles:b.profilesTotal,qaResidue:0}));
          NODE

      - name: Post-cleanup production and deployment invariants
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o provider-cost-deployments-after.json
          node - <<'NODE'
          const fs=require('node:fs');const body=JSON.parse(fs.readFileSync('provider-cost-deployments-after.json','utf8'));
          if(body?.success!==true) throw new Error('Cloudflare deployment read failed');
          const source=Array.isArray(body.result?.deployments)?body.result.deployments:Array.isArray(body.result)?body.result:[];
          const deployments=source.map(x=>String(x.id||'')).filter(Boolean).sort();
          const versions=[...new Set(source.flatMap(x=>Array.isArray(x.versions)?x.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          const beforeD=String(process.env.PROVIDER_COST_PRODUCTION_DEPLOYMENTS||'').split(',').filter(Boolean).sort();
          const beforeV=String(process.env.PROVIDER_COST_PRODUCTION_VERSIONS||'').split(',').filter(Boolean).sort();
          if(JSON.stringify(deployments)!==JSON.stringify(beforeD)) throw new Error('production deployment set changed during provider-cost runtime');
          if(JSON.stringify(versions)!==JSON.stringify(beforeV)) throw new Error('production version set changed during provider-cost runtime');
          if(versions.includes(process.env.PROVIDER_COST_PREVIEW_VERSION_ID||'')) throw new Error('Preview attached to production after runtime');
          console.log('PROVIDER_COST_POST_CLEANUP_PRODUCTION: PASS',JSON.stringify({productionVersions:versions,previewAttached:false}));
          NODE

      - name: Remove local ephemeral material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ ! -f .provider-cost-runtime-secrets.env ] || shred -u .provider-cost-runtime-secrets.env 2>/dev/null || rm -f .provider-cost-runtime-secrets.env
          rm -f provider-cost-*.json provider-cost-*.log provider-cost-sensitive-findings.txt
          echo "PROVIDER_COST_EPHEMERAL_MATERIAL_CLEANUP: PASS"
