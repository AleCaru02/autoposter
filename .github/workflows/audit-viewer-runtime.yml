name: Audit Viewer Authenticated Runtime

on:
  workflow_dispatch:

concurrency:
  group: audit-viewer-authenticated-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected verifier ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Pin certified production base and verification-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected="1377724860fb8cf210d5fb8c677d71fd3faa851b"
          if [ "$GITHUB_REF_NAME" != "verify/ai-content-text-gating-runtime" ]; then
            echo "RUNTIME_VERIFIER_NOT_CERTIFIED: wrong branch $GITHUB_REF_NAME" >&2
            exit 1
          fi
          merge_base=$(git merge-base HEAD "$expected")
          if [ "$merge_base" != "$expected" ]; then
            echo "RUNTIME_VERIFIER_NOT_CERTIFIED: production base mismatch $merge_base" >&2
            exit 1
          fi
          changed=$(git diff --name-only "$expected"...HEAD)
          printf '%s\n' "$changed" > ai-text-verifier-diff.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/audit-viewer-runtime.yml|.github/workflows/gate.yml|tests/ai-content-text-*|tests/wrangler.ai-content-text-runtime.jsonc) ;;
              *)
                echo "RUNTIME_VERIFIER_NOT_CERTIFIED: product diff detected: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          echo "AI content text verifier scope: PASS"

      - name: Static pre-certification gate
        run: |
          npm run typecheck
          npm run test:entitlements
          npm run test:entitlement-migration
          npm run test:ai-text-gating
          node tests/ai-content-text-provider-harness.test.mjs
          node tests/ai-content-text-runtime-static.test.mjs
          npm run test:tenant-security
          npm run test:tenant-cross-security
          npm run build
          npx wrangler versions upload --dry-run
          npx wrangler versions upload --dry-run --config tests/wrangler.ai-content-text-runtime.jsonc

      - name: Generate ephemeral AI text QA material
        shell: bash
        run: |
          set -euo pipefail
          marker="${GITHUB_RUN_ID}"
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          alias="aitextqa-${GITHUB_RUN_ID}"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "AI_TEXT_QA_MARKER=$marker" >> "$GITHUB_ENV"
          echo "AI_TEXT_QA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "AI_TEXT_QA_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "AI_TEXT_PREVIEW_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "AI_TEXT_PREVIEW_URL=https://${alias}-autoposter.02alessandrocaruso.workers.dev" >> "$GITHUB_ENV"
          printf 'AI_TEXT_QA_TOKEN=%s\n' "$token" > .ai-text-runtime-secrets.env
          chmod 600 .ai-text-runtime-secrets.env

      - name: Upload provider-instrumented Preview version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload \
            --config tests/wrangler.ai-content-text-runtime.jsonc \
            --keep-vars \
            --preview-alias "$AI_TEXT_PREVIEW_ALIAS" \
            --secrets-file .ai-text-runtime-secrets.env | tee ai-text-upload.log
          version_id=$(sed -n 's/^Worker Version ID: \([0-9a-fA-F-]*\)$/\1/p' ai-text-upload.log | tail -n 1)
          if ! printf '%s' "$version_id" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}$'; then
            echo "RUNTIME_VERIFIER_NOT_CERTIFIED: Preview version id not captured" >&2
            exit 1
          fi
          echo "AI_TEXT_PREVIEW_VERSION_ID=$version_id" >> "$GITHUB_ENV"
          chmod 600 .ai-text-runtime-secrets.env || true
          shred -u .ai-text-runtime-secrets.env 2>/dev/null || rm -f .ai-text-runtime-secrets.env

      - name: Verify Preview isolation from production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" \
            -o ai-text-deployments-before.json
          node - <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('ai-text-deployments-before.json','utf8'));
          if(body?.success!==true) throw new Error('Cloudflare deployment read failed');
          const result=body.result;
          const deployments=Array.isArray(result?.deployments)?result.deployments:Array.isArray(result)?result:[];
          if(!deployments.length) throw new Error('no production deployments returned');
          const deploymentIds=deployments.map(x=>String(x.id||'')).filter(Boolean).sort();
          const versionIds=[...new Set(deployments.flatMap(x=>Array.isArray(x.versions)?x.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          const ephemeral=process.env.AI_TEXT_PREVIEW_VERSION_ID||'';
          if(!ephemeral) throw new Error('Preview version id missing');
          if(versionIds.includes(ephemeral)) throw new Error('Preview version attached to production');
          fs.appendFileSync(process.env.GITHUB_ENV,`AI_TEXT_PRODUCTION_DEPLOYMENT_IDS=${deploymentIds.join(',')}\nAI_TEXT_PRODUCTION_VERSION_IDS=${versionIds.join(',')}\n`);
          console.log('AI_TEXT_PREVIEW_ISOLATION: PASS',JSON.stringify({attachedToProduction:false,productionDeployments:deploymentIds.length}));
          NODE

      - name: Provider instrumentation preflight and stale QA recovery
        shell: bash
        run: |
          set -euo pipefail
          wrong=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H 'content-type: application/json' \
            -H 'x-ai-text-qa-token: wrong' \
            -H "x-ai-text-qa-marker: $AI_TEXT_QA_MARKER" \
            --data "{\"action\":\"preflight\",\"marker\":\"$AI_TEXT_QA_MARKER\"}" \
            "$AI_TEXT_PREVIEW_URL/__qa/control" || true)
          if [ "$wrong" != "403" ]; then
            echo "RUNTIME_VERIFIER_NOT_CERTIFIED: Preview token gate HTTP $wrong" >&2
            exit 1
          fi

          read_preflight() {
            curl -sS -o ai-text-preflight.json -w "%{http_code}" -X POST \
              -H 'content-type: application/json' \
              -H "x-ai-text-qa-token: $AI_TEXT_QA_TOKEN_VALUE" \
              -H "x-ai-text-qa-marker: $AI_TEXT_QA_MARKER" \
              --data "{\"action\":\"preflight\",\"marker\":\"$AI_TEXT_QA_MARKER\"}" \
              "$AI_TEXT_PREVIEW_URL/__qa/control"
          }

          status=$(read_preflight)
          if [ "$status" != "200" ]; then
            echo "RUNTIME_VERIFIER_NOT_CERTIFIED: Preview preflight HTTP $status" >&2
            exit 1
          fi
          stale=$(node -e "const b=require('./ai-text-preflight.json');process.stdout.write(String(Number(b.recognizedQaUsers||0)))")
          if [ "$stale" -gt 0 ]; then
            cleanup_status=$(curl -sS -o ai-text-stale-cleanup.json -w "%{http_code}" -X POST \
              -H 'content-type: application/json' \
              -H "x-ai-text-qa-token: $AI_TEXT_QA_TOKEN_VALUE" \
              -H "x-ai-text-qa-marker: $AI_TEXT_QA_MARKER" \
              --data "{\"action\":\"cleanup-residue\",\"marker\":\"$AI_TEXT_QA_MARKER\"}" \
              "$AI_TEXT_PREVIEW_URL/__qa/control")
            CLEANUP_STATUS="$cleanup_status" node - <<'NODE'
            const fs=require('node:fs');
            const body=JSON.parse(fs.readFileSync('ai-text-stale-cleanup.json','utf8'));
            if(process.env.CLEANUP_STATUS!=='200'||body.cleaned!==true||body.recognizedQaUsers!==0) throw new Error('stale QA cleanup failed');
            NODE
            status=$(read_preflight)
          fi

          inst_status=$(curl -sS -o ai-text-instrumentation.json -w "%{http_code}" -X POST \
            -H 'content-type: application/json' \
            -H "x-ai-text-qa-token: $AI_TEXT_QA_TOKEN_VALUE" \
            -H "x-ai-text-qa-marker: $AI_TEXT_QA_MARKER" \
            --data "{\"action\":\"instrumentation-status\",\"marker\":\"$AI_TEXT_QA_MARKER\"}" \
            "$AI_TEXT_PREVIEW_URL/__qa/control")
          PREFLIGHT_STATUS="$status" INSTRUMENTATION_STATUS="$inst_status" node - <<'NODE'
          const fs=require('node:fs');
          const pre=JSON.parse(fs.readFileSync('ai-text-preflight.json','utf8'));
          const inst=JSON.parse(fs.readFileSync('ai-text-instrumentation.json','utf8'));
          if(process.env.PREFLIGHT_STATUS!=='200') throw new Error(`preflight HTTP ${process.env.PREFLIGHT_STATUS}`);
          if(process.env.INSTRUMENTATION_STATUS!=='200'||inst.armed!==true||inst.previewOnly!==true||inst.promptLogging!==false){
            throw new Error('RUNTIME_VERIFIER_NOT_CERTIFIED: provider instrumentation unarmed');
          }
          for(const type of ['MAIN','RESEARCH','FACTCHECK','EDITORIAL_QA','PROVIDER_FAILURE','LATENCY']) if(!inst.supports?.includes(type)) throw new Error(`RUNTIME_VERIFIER_NOT_CERTIFIED: instrumentation ${type}`);
          for(const key of ['qaUsers','recognizedQaUsers','qaProfiles','qaOwners','qaEntitlements','qaUsageEvents','qaUsageBuckets','qaAiEvents','qaTechnicalOutbox','qaContent','qaVariants','qaJobs','qaProviderCalls']) if(pre[key]!==0) throw new Error(`preflight residue ${key}=${pre[key]}`);
          if(pre.superAdmins!==1||pre.profilesWithoutOwner!==0||pre.multipleOwners!==0||pre.ownerMismatch!==0||pre.openPolicies!==0||pre.anonymousPrivilegedTables!==0) throw new Error('production security baseline failed');
          fs.appendFileSync(process.env.GITHUB_ENV,`AI_TEXT_BASELINE_PROFILES=${pre.profilesTotal}\nAI_TEXT_CONTROLLER_READY=true\n`);
          console.log('AI_TEXT_PROVIDER_INSTRUMENTATION: ARMED',JSON.stringify({previewOnly:true,persistedCounter:inst.persistedCounter,promptLogging:false,realProviderAvailable:pre.realProviderAvailable===true}));
          NODE

      - name: AI content text authenticated runtime
        shell: bash
        run: |
          set -euo pipefail
          node tests/ai-content-text-runtime.mjs | tee ai-text-runtime-output.log

      - name: Sensitive output scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=""
          for f in ai-text-runtime-output.log ai-text-upload.log ai-text-preflight.json ai-text-instrumentation.json ai-text-stale-cleanup.json; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -n "$files" ]; then
            if grep -Eini \
              '(sk-[A-Za-z0-9_-]{16,}|postgres(ql)?://[^[:space:]]+|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|Set-Cookie:[[:space:]]*[^[:space:]]+|Cookie:[[:space:]]*[^[:space:]]+|AI_TEXT_QA_TOKEN_VALUE=[A-Za-z0-9]{16,}|AI_TEXT_QA_PASSWORD=[A-Za-z0-9]{16,}|DATABASE_URL=[^[:space:]]+)' \
              $files > ai-text-sensitive-findings.txt; then
              cat ai-text-sensitive-findings.txt >&2
              echo "sensitiveFindings > 0" >&2
              exit 1
            fi
          fi
          echo "sensitiveFindings=0"

      - name: Cleanup AI text ephemeral fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AI_TEXT_CONTROLLER_READY:-}" != "true" ]; then
            echo "AI_TEXT_CLEANUP_NOT_ARMED: no QA fixtures authorized"
            exit 0
          fi
          status=$(curl -sS -o ai-text-cleanup.json -w "%{http_code}" -X POST \
            -H 'content-type: application/json' \
            -H "x-ai-text-qa-token: $AI_TEXT_QA_TOKEN_VALUE" \
            -H "x-ai-text-qa-marker: $AI_TEXT_QA_MARKER" \
            --data "{\"action\":\"cleanup\",\"marker\":\"$AI_TEXT_QA_MARKER\"}" \
            "$AI_TEXT_PREVIEW_URL/__qa/control" || true)
          CLEANUP_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');
          const body=JSON.parse(fs.readFileSync('ai-text-cleanup.json','utf8'));
          if(process.env.CLEANUP_STATUS!=='200'||body.cleaned!==true) throw new Error(`cleanup failed HTTP ${process.env.CLEANUP_STATUS}`);
          for(const key of ['qaUsers','recognizedQaUsers','qaProfiles','qaOwners','qaAppUsers','qaSessions','qaAccounts','qaEntitlements','qaUsageEvents','qaUsageBuckets','qaAiEvents','qaTechnicalOutbox','qaContent','qaVariants','qaJobs','qaProviderCalls']) if(body[key]!==0) throw new Error(`cleanup residue ${key}=${body[key]}`);
          if(body.superAdmins!==1) throw new Error(`SUPER_ADMIN post-cleanup ${body.superAdmins}`);
          if(String(body.profilesTotal)!==String(process.env.AI_TEXT_BASELINE_PROFILES)) throw new Error(`profile baseline mismatch ${body.profilesTotal} != ${process.env.AI_TEXT_BASELINE_PROFILES}`);
          if(body.profilesWithoutOwner!==0||body.multipleOwners!==0||body.ownerMismatch!==0||body.openPolicies!==0||body.anonymousPrivilegedTables!==0) throw new Error('post-cleanup security invariant failed');
          console.log('AI_TEXT_CLEANUP: PASS',JSON.stringify({qaUsers:0,qaProfiles:0,qaUsageEvents:0,qaAiEvents:0,qaContent:0,qaJobs:0,superAdmins:body.superAdmins,profilesTotal:body.profilesTotal}));
          NODE

      - name: Post-cleanup production and deployment invariants
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit -o ai-text-tenant-audit.json
          curl -fsS https://autoposter.02alessandrocaruso.workers.dev/api/security/managed-auth-capabilities -o ai-text-auth-audit.json
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" \
            -o ai-text-deployments-after.json
          node - <<'NODE'
          const fs=require('node:fs');
          const tenant=JSON.parse(fs.readFileSync('ai-text-tenant-audit.json','utf8'));
          const auth=JSON.parse(fs.readFileSync('ai-text-auth-audit.json','utf8'));
          const cf=JSON.parse(fs.readFileSync('ai-text-deployments-after.json','utf8'));
          if(tenant?.ready!==true||tenant?.ownerContract?.ready!==true) throw new Error('tenant invariant not ready');
          if(tenant.ownerContract.profilesWithoutOwner!==0) throw new Error(`profilesWithoutOwner ${tenant.ownerContract.profilesWithoutOwner}`);
          if(auth?.managedAuth?.ready!==true||auth.managedAuth.nativeAdminUsers!==1) throw new Error(`native SUPER_ADMIN ${auth?.managedAuth?.nativeAdminUsers}`);
          if(process.env.AI_TEXT_BASELINE_PROFILES&&String(tenant.ownerContract.profilesTotal)!==String(process.env.AI_TEXT_BASELINE_PROFILES)) throw new Error('profile baseline changed');
          if(cf?.success!==true) throw new Error('Cloudflare deployment read failed');
          const result=cf.result;
          const deployments=Array.isArray(result?.deployments)?result.deployments:Array.isArray(result)?result:[];
          const deploymentIds=deployments.map(x=>String(x.id||'')).filter(Boolean).sort();
          const versionIds=[...new Set(deployments.flatMap(x=>Array.isArray(x.versions)?x.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          const beforeDeployments=String(process.env.AI_TEXT_PRODUCTION_DEPLOYMENT_IDS||'').split(',').filter(Boolean).sort();
          const beforeVersions=String(process.env.AI_TEXT_PRODUCTION_VERSION_IDS||'').split(',').filter(Boolean).sort();
          if(JSON.stringify(deploymentIds)!==JSON.stringify(beforeDeployments)||JSON.stringify(versionIds)!==JSON.stringify(beforeVersions)) throw new Error('production deployment changed during verifier');
          if(versionIds.includes(process.env.AI_TEXT_PREVIEW_VERSION_ID||'')) throw new Error('QA Preview attached to production');
          console.log('AI_TEXT_POST_CLEANUP_PRODUCTION: PASS',JSON.stringify({nativeAdminUsers:auth.managedAuth.nativeAdminUsers,profilesTotal:tenant.ownerContract.profilesTotal,profilesWithoutOwner:tenant.ownerContract.profilesWithoutOwner,productionDeploymentUnchanged:true}));
          NODE

      - name: Remove local ephemeral credential material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .ai-text-runtime-secrets.env ]; then
            chmod 600 .ai-text-runtime-secrets.env || true
            shred -u .ai-text-runtime-secrets.env 2>/dev/null || rm -f .ai-text-runtime-secrets.env
          fi
          rm -f ai-text-verifier-diff.txt ai-text-upload.log ai-text-preflight.json ai-text-instrumentation.json ai-text-stale-cleanup.json ai-text-cleanup.json ai-text-runtime-output.log ai-text-sensitive-findings.txt ai-text-tenant-audit.json ai-text-auth-audit.json ai-text-deployments-before.json ai-text-deployments-after.json
          echo "AI_TEXT_EPHEMERAL_SECRET_CLEANUP: PASS"
