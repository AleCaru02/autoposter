name: Audit Viewer Authenticated Runtime

on:
  workflow_dispatch:

concurrency:
  group: fase7c-content-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }

      - name: Static safety gate
        run: |
          set -euo pipefail
          npm run typecheck
          npm run test:fase7c-content-generation
          npm run test:fase7c-runtime-static
          npm run test:ai-text-gating
          npm run test:image-generation-gating
          npm run test:tenant-cross-security

      - name: Verify required AI secret presence
        shell: bash
        env:
          OPENAI_API_KEY_SOURCE: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY_SOURCE" ]; then
            echo "GITHUB_OPENAI_SECRET_AVAILABLE: FAIL" >&2
            exit 1
          fi
          echo "GITHUB_OPENAI_SECRET_AVAILABLE: PASS"
          npx wrangler secret list --format json > fase7c-secret-names.json
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('fase7c-secret-names.json', 'utf8'));
          const names = new Set(Array.isArray(rows) ? rows.map((row) => row?.name).filter(Boolean) : []);
          for (const required of ['DATABASE_URL', 'OPENAI_API_KEY']) {
            if (!names.has(required)) throw new Error(`CLOUDFLARE_REQUIRED_SECRET_MISSING:${required}`);
          }
          console.log('CLOUDFLARE_REQUIRED_AI_SECRETS: PASS', JSON.stringify({ databaseUrl: true, openAiApiKey: true }));
          NODE

      - name: Generate ephemeral FASE 7C material
        shell: bash
        run: |
          set -euo pipefail
          marker="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          alias="fase7cqa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          owner_email="fase7c-${marker}-owner@example.invalid"
          other_email="fase7c-${marker}-other@example.invalid"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "::add-mask::$owner_email"
          echo "::add-mask::$other_email"
          echo "FASE7C_RUNTIME_MARKER=$marker" >> "$GITHUB_ENV"
          echo "FASE7C_RUNTIME_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "FASE7C_RUNTIME_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "FASE7C_PREVIEW_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "FASE7C_RUNTIME_CONTROLLER_URL=https://${alias}-autoposter.02alessandrocaruso.workers.dev/" >> "$GITHUB_ENV"
          printf 'FASE7C_RUNTIME_TOKEN=%s\n' "$token" > .fase7c-runtime-secrets.env
          chmod 600 .fase7c-runtime-secrets.env

      - name: Upload fixed-scope controller as non-deployed Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions upload \
            --config tests/wrangler.fase7c-runtime.jsonc \
            --keep-vars \
            --preview-alias "$FASE7C_PREVIEW_ALIAS" \
            --secrets-file .fase7c-runtime-secrets.env | tee fase7c-upload.log
          version_id=$(sed -n 's/^Worker Version ID: \([0-9a-fA-F-]*\)$/\1/p' fase7c-upload.log | tail -n 1)
          if ! printf '%s' "$version_id" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}$'; then
            echo "preview version id not captured" >&2
            exit 1
          fi
          echo "FASE7C_CONTROLLER_VERSION_ID=$version_id" >> "$GITHUB_ENV"
          echo "FASE7C_PREVIEW_UPLOADED=true" >> "$GITHUB_ENV"

      - name: Verify preview version is isolated from production deployments
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" \
            -o fase7c-deployments-before.json
          node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('fase7c-deployments-before.json', 'utf8'));
          if (body?.success !== true) throw new Error('Cloudflare deployment read failed');
          const result = body.result;
          const deployments = Array.isArray(result?.deployments) ? result.deployments : Array.isArray(result) ? result : [];
          if (!deployments.length) throw new Error('no production deployments returned');
          const deploymentIds = deployments.map((item) => String(item.id || '')).filter(Boolean).sort();
          const versionIds = [...new Set(deployments.flatMap((item) => Array.isArray(item.versions) ? item.versions.map((version) => String(version.version_id || '')) : []).filter(Boolean))].sort();
          const ephemeral = process.env.FASE7C_CONTROLLER_VERSION_ID || '';
          if (!ephemeral || versionIds.includes(ephemeral)) throw new Error('ephemeral controller is missing or attached to production');
          fs.appendFileSync(process.env.GITHUB_ENV, `FASE7C_PRODUCTION_DEPLOYMENT_IDS=${deploymentIds.join(',')}\nFASE7C_PRODUCTION_VERSION_IDS=${versionIds.join(',')}\n`);
          console.log('FASE7C_PREVIEW_ISOLATION: PASS', JSON.stringify({ ephemeralVersionId: ephemeral, attachedToProduction: false }));
          NODE

      - name: Preview preflight and exact stale-fixture recovery
        shell: bash
        run: |
          set -euo pipefail
          wrong=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' -H 'x-fase7c-runtime-token: wrong' \
            --data "{\"action\":\"preflight\",\"marker\":\"$FASE7C_RUNTIME_MARKER\"}" "$FASE7C_RUNTIME_CONTROLLER_URL" || true)
          if [ "$wrong" != "403" ]; then echo "preview token gate failed: HTTP $wrong" >&2; exit 1; fi
          read_preflight() {
            curl -sS -o fase7c-preflight.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-fase7c-runtime-token: $FASE7C_RUNTIME_TOKEN_VALUE" \
              --data "{\"action\":\"preflight\",\"marker\":\"$FASE7C_RUNTIME_MARKER\"}" "$FASE7C_RUNTIME_CONTROLLER_URL"
          }
          status=$(read_preflight)
          if [ "$status" != "200" ]; then echo "preview preflight failed HTTP $status" >&2; exit 1; fi
          stale=$(node -e "const b=require('./fase7c-preflight.json'); process.stdout.write(String(Number(b.recognizedQaUsers||0)))")
          if [ "$stale" -gt 0 ]; then
            cleanup_status=$(curl -sS -o fase7c-stale-cleanup.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-fase7c-runtime-token: $FASE7C_RUNTIME_TOKEN_VALUE" \
              --data "{\"action\":\"cleanup-residue\",\"marker\":\"$FASE7C_RUNTIME_MARKER\"}" "$FASE7C_RUNTIME_CONTROLLER_URL")
            CLEANUP_STATUS="$cleanup_status" node -e "const b=require('./fase7c-stale-cleanup.json'); if(process.env.CLEANUP_STATUS!=='200'||b.ok!==true||b.recognizedQaUsers!==0) throw new Error('stale cleanup failed');"
            status=$(read_preflight)
          fi
          PREFLIGHT_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('fase7c-preflight.json', 'utf8'));
          if (process.env.PREFLIGHT_STATUS !== '200') throw new Error(`preflight HTTP ${process.env.PREFLIGHT_STATUS}`);
          for (const key of ['qaUsers','qaProfiles','qaOwners','qaContentItems','qaContentVariants','qaAssets','qaPublicationJobs','recognizedQaUsers']) if (body[key] !== 0) throw new Error(`preflight residue ${key}=${body[key]}`);
          if (body.profilesWithoutOwner !== 0) throw new Error(`profilesWithoutOwner=${body.profilesWithoutOwner}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `FASE7C_BASELINE_PROFILES=${body.profilesTotal}\nFASE7C_CONTROLLER_READY=true\n`);
          console.log('FASE7C_PREFLIGHT: PASS', JSON.stringify({ profilesTotal: body.profilesTotal, profilesWithoutOwner: body.profilesWithoutOwner }));
          NODE

      - name: FASE 7C authenticated content runtime
        run: |
          set -euo pipefail
          node tests/fase7c-runtime.mjs

      - name: Cleanup ephemeral FASE 7C identities and data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${FASE7C_CONTROLLER_READY:-}" != "true" ]; then echo "FASE7C_CLEANUP_NOT_REQUIRED"; exit 0; fi
          status=$(curl -sS -o fase7c-cleanup.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-fase7c-runtime-token: $FASE7C_RUNTIME_TOKEN_VALUE" \
            --data "{\"action\":\"cleanup\",\"marker\":\"$FASE7C_RUNTIME_MARKER\"}" "$FASE7C_RUNTIME_CONTROLLER_URL" || true)
          FASE7C_CLEANUP_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('fase7c-cleanup.json', 'utf8'));
          if (process.env.FASE7C_CLEANUP_STATUS !== '200' || body.ok !== true) throw new Error(`cleanup failed HTTP ${process.env.FASE7C_CLEANUP_STATUS}`);
          for (const key of ['qaUsers','qaProfiles','qaAppUsers','qaSessions','qaAccounts','qaOwners','qaBrandProfiles','qaContentItems','qaContentVariants','qaAssets','qaPublicationJobs','qaCapabilityEvents','qaAiUsageEvents','qaPackageAssignments','qaAuditRows']) if (body[key] !== 0) throw new Error(`cleanup residue ${key}=${body[key]}`);
          if (body.profilesWithoutOwner !== 0) throw new Error(`profilesWithoutOwner=${body.profilesWithoutOwner}`);
          if (String(body.profilesTotal) !== String(process.env.FASE7C_BASELINE_PROFILES)) throw new Error(`profile baseline mismatch ${body.profilesTotal}`);
          console.log('FASE7C_CLEANUP: PASS', JSON.stringify({ cleanedUsers: body.cleanedUsers, profilesTotal: body.profilesTotal, allQaResidue: 0 }));
          NODE

      - name: Post-cleanup production and deployment invariants
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS https://autoposter.02alessandrocaruso.workers.dev/api/security/tenant-audit -o fase7c-tenant-audit.json
          curl -fsS https://autoposter.02alessandrocaruso.workers.dev/api/security/managed-auth-capabilities -o fase7c-auth-audit.json
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o fase7c-deployments-after.json
          node - <<'NODE'
          const fs = require('node:fs');
          const tenant = JSON.parse(fs.readFileSync('fase7c-tenant-audit.json', 'utf8'));
          const auth = JSON.parse(fs.readFileSync('fase7c-auth-audit.json', 'utf8'));
          const cloudflare = JSON.parse(fs.readFileSync('fase7c-deployments-after.json', 'utf8'));
          if (tenant?.ready !== true || tenant?.ownerContract?.ready !== true || tenant.ownerContract.profilesWithoutOwner !== 0) throw new Error('tenant/owner invariant failed');
          if (auth?.managedAuth?.ready !== true || auth.managedAuth.nativeAdminUsers !== 1) throw new Error('Managed Auth invariant failed');
          if (process.env.FASE7C_BASELINE_PROFILES && String(tenant.ownerContract.profilesTotal) !== String(process.env.FASE7C_BASELINE_PROFILES)) throw new Error('profile baseline changed');
          if (cloudflare?.success !== true) throw new Error('Cloudflare deployment read failed');
          const result = cloudflare.result;
          const deployments = Array.isArray(result?.deployments) ? result.deployments : Array.isArray(result) ? result : [];
          const deploymentIds = deployments.map((item) => String(item.id || '')).filter(Boolean).sort();
          const versionIds = [...new Set(deployments.flatMap((item) => Array.isArray(item.versions) ? item.versions.map((version) => String(version.version_id || '')) : []).filter(Boolean))].sort();
          const beforeDeployments = String(process.env.FASE7C_PRODUCTION_DEPLOYMENT_IDS || '').split(',').filter(Boolean).sort();
          const beforeVersions = String(process.env.FASE7C_PRODUCTION_VERSION_IDS || '').split(',').filter(Boolean).sort();
          if (JSON.stringify(deploymentIds) !== JSON.stringify(beforeDeployments) || JSON.stringify(versionIds) !== JSON.stringify(beforeVersions)) throw new Error('production deployment changed during verifier');
          if (versionIds.includes(process.env.FASE7C_CONTROLLER_VERSION_ID || '')) throw new Error('preview controller attached to production');
          console.log('FASE7C_POST_CLEANUP_PRODUCTION: PASS', JSON.stringify({ profilesTotal: tenant.ownerContract.profilesTotal, nativeAdminUsers: auth.managedAuth.nativeAdminUsers, deploymentImmutable: true }));
          NODE

      - name: Remove local ephemeral credential material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .fase7c-runtime-secrets.env ]; then chmod 600 .fase7c-runtime-secrets.env || true; shred -u .fase7c-runtime-secrets.env 2>/dev/null || rm -f .fase7c-runtime-secrets.env; fi
          rm -f fase7c-secret-names.json fase7c-preflight.json fase7c-stale-cleanup.json fase7c-cleanup.json fase7c-tenant-audit.json fase7c-auth-audit.json fase7c-upload.log fase7c-deployments-before.json fase7c-deployments-after.json
          echo "FASE7C_EPHEMERAL_SECRET_CLEANUP: PASS"
