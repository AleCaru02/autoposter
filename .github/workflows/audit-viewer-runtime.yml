name: Audit Viewer Authenticated Runtime

on:
  workflow_dispatch:

concurrency:
  group: audit-viewer-authenticated-runtime
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout selected verifier ref
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Pin production base and verifier-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected="3c9697ae83a3422fafc2711658e7986b608349b1"
          [ "$GITHUB_REF_NAME" = "verify/fase5-onboarding-runtime" ] || { echo "wrong verifier branch" >&2; exit 1; }
          [ "$(git merge-base HEAD "$expected")" = "$expected" ] || { echo "production base mismatch" >&2; exit 1; }
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/audit-viewer-runtime.yml|.github/workflows/gate.yml|tests/audit-viewer-runtime-static.test.mjs|tests/onboarding-runtime*|tests/wrangler.onboarding-runtime.jsonc) ;;
              *) echo "product diff detected: $path" >&2; exit 1 ;;
            esac
          done <<< "$(git diff --name-only "$expected"...HEAD)"
          echo "FASE 5A verifier scope: PASS"

      - name: Static pre-certification gate
        run: |
          npm run typecheck
          npm run test:onboarding-provisioning
          npm run test:tenant-security
          npm run test:tenant-cross-security
          node tests/onboarding-runtime-static.test.mjs
          npm run build
          npx wrangler versions upload --dry-run --config tests/wrangler.onboarding-runtime.jsonc

      - name: Generate ephemeral onboarding QA material
        shell: bash
        run: |
          set -euo pipefail
          marker="$GITHUB_RUN_ID"
          password=$(openssl rand -hex 24)
          token=$(openssl rand -hex 32)
          alias="onboardqa-$GITHUB_RUN_ID"
          echo "::add-mask::$password"
          echo "::add-mask::$token"
          echo "ONBOARDING_QA_MARKER=$marker" >> "$GITHUB_ENV"
          echo "ONBOARDING_QA_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "ONBOARDING_QA_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "ONBOARDING_QA_CONTROLLER_URL=https://${alias}-autoposter.02alessandrocaruso.workers.dev" >> "$GITHUB_ENV"
          printf 'ONBOARDING_QA_TOKEN=%s\n' "$token" > .onboarding-runtime-secrets.env
          chmod 600 .onboarding-runtime-secrets.env

      - name: Upload cleanup controller as isolated Preview version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          alias="onboardqa-$GITHUB_RUN_ID"
          npx wrangler versions upload --config tests/wrangler.onboarding-runtime.jsonc --keep-vars --preview-alias "$alias" --secrets-file .onboarding-runtime-secrets.env | tee onboarding-upload.log
          version_id=$(sed -n 's/^Worker Version ID: \([0-9a-fA-F-]*\)$/\1/p' onboarding-upload.log | tail -n 1)
          printf '%s' "$version_id" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F-]{27,}$'
          echo "ONBOARDING_QA_PREVIEW_VERSION_ID=$version_id" >> "$GITHUB_ENV"
          shred -u .onboarding-runtime-secrets.env 2>/dev/null || rm -f .onboarding-runtime-secrets.env

      - name: Verify Preview isolation from production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o onboarding-deployments-before.json
          node - <<'NODE'
          const fs=require('node:fs');const body=JSON.parse(fs.readFileSync('onboarding-deployments-before.json','utf8'));
          if(body?.success!==true) throw new Error('deployment read failed');
          const source=Array.isArray(body.result?.deployments)?body.result.deployments:Array.isArray(body.result)?body.result:[];
          const deployments=source.map(x=>String(x.id||'')).filter(Boolean).sort();
          const versions=[...new Set(source.flatMap(x=>Array.isArray(x.versions)?x.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          if(!source.length||versions.includes(process.env.ONBOARDING_QA_PREVIEW_VERSION_ID||'')) throw new Error('Preview isolation failed');
          fs.appendFileSync(process.env.GITHUB_ENV,`ONBOARDING_PRODUCTION_DEPLOYMENTS=${deployments.join(',')}\nONBOARDING_PRODUCTION_VERSIONS=${versions.join(',')}\n`);
          console.log('ONBOARDING_PREVIEW_ISOLATION: PASS',JSON.stringify({previewAttached:false,productionVersions:versions}));
          NODE

      - name: Preflight and stale QA recovery
        shell: bash
        run: |
          set -euo pipefail
          call_controller() { curl -sS -o "$2" -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-onboarding-qa-token: $ONBOARDING_QA_TOKEN_VALUE" --data "{\"action\":\"$1\",\"marker\":\"$ONBOARDING_QA_MARKER\"}" "$ONBOARDING_QA_CONTROLLER_URL"; }
          wrong=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H 'content-type: application/json' -H 'x-onboarding-qa-token: wrong' --data "{\"action\":\"preflight\",\"marker\":\"$ONBOARDING_QA_MARKER\"}" "$ONBOARDING_QA_CONTROLLER_URL" || true)
          [ "$wrong" = "403" ] || { echo "controller token gate failed" >&2; exit 1; }
          status=$(call_controller preflight onboarding-preflight.json); [ "$status" = "200" ] || exit 1
          stale=$(node -e "const b=require('./onboarding-preflight.json');process.stdout.write(String(Number(b.recognizedQaUsers||0)+Number(b.recognizedQaAudit||0)))")
          if [ "$stale" -gt 0 ]; then cleanup=$(call_controller cleanup-residue onboarding-stale-cleanup.json); [ "$cleanup" = "200" ] || exit 1; status=$(call_controller preflight onboarding-preflight.json); fi
          PREFLIGHT_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('onboarding-preflight.json','utf8'));
          if(process.env.PREFLIGHT_STATUS!=='200') throw new Error('preflight failed');
          for(const k of ['qaUsers','recognizedQaUsers','qaProfiles','qaOwners','qaAssignments','qaEntitlements','qaOperations','qaAudit','recognizedQaAudit']) if(b[k]!==0) throw new Error(`residue ${k}=${b[k]}`);
          if(b.profilesWithoutOwner!==0) throw new Error('owner invariant failed');
          fs.appendFileSync(process.env.GITHUB_ENV,`ONBOARDING_BASELINE_PROFILES=${b.profilesTotal}\nONBOARDING_CONTROLLER_READY=true\n`);
          console.log('ONBOARDING_PREFLIGHT: PASS',JSON.stringify({profiles:b.profilesTotal,qaResidue:0}));
          NODE

      - name: FASE 5A authenticated onboarding runtime
        shell: bash
        run: |
          set -euo pipefail
          node tests/onboarding-runtime.mjs | tee onboarding-runtime-output.log

      - name: Sensitive output scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          files=""
          for f in onboarding-runtime-output.log onboarding-upload.log onboarding-preflight.json onboarding-stale-cleanup.json; do [ -f "$f" ] && files="$files $f"; done
          if [ -n "$files" ] && grep -Eini '(sk-[A-Za-z0-9_-]{16,}|postgres(ql)?://[^[:space:]]+|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|Set-Cookie:|Cookie:|ONBOARDING_QA_(TOKEN_VALUE|PASSWORD)=|DATABASE_URL=)' $files > onboarding-sensitive-findings.txt; then cat onboarding-sensitive-findings.txt >&2; exit 1; fi
          echo "sensitiveFindings=0"

      - name: Cleanup onboarding QA fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ONBOARDING_CONTROLLER_READY:-}" != "true" ]; then echo "ONBOARDING_CLEANUP_NOT_ARMED"; exit 0; fi
          status=$(curl -sS -o onboarding-cleanup.json -w "%{http_code}" -X POST -H 'content-type: application/json' -H "x-onboarding-qa-token: $ONBOARDING_QA_TOKEN_VALUE" --data "{\"action\":\"cleanup\",\"marker\":\"$ONBOARDING_QA_MARKER\"}" "$ONBOARDING_QA_CONTROLLER_URL" || true)
          CLEANUP_STATUS="$status" node - <<'NODE'
          const fs=require('node:fs');const b=JSON.parse(fs.readFileSync('onboarding-cleanup.json','utf8'));
          if(process.env.CLEANUP_STATUS!=='200'||b.cleaned!==true) throw new Error('cleanup failed');
          for(const k of ['qaUsers','recognizedQaUsers','qaProfiles','qaOwners','qaAssignments','qaEntitlements','qaOperations','qaAudit','recognizedQaAudit']) if(b[k]!==0) throw new Error(`cleanup residue ${k}=${b[k]}`);
          if(String(b.profilesTotal)!==String(process.env.ONBOARDING_BASELINE_PROFILES)||b.profilesWithoutOwner!==0) throw new Error('post-cleanup invariant failed');
          console.log('ONBOARDING_CLEANUP: PASS',JSON.stringify({profiles:b.profilesTotal,qaResidue:0}));
          NODE

      - name: Post-cleanup production and deployment invariants
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o onboarding-deployments-after.json
          node - <<'NODE'
          const fs=require('node:fs');const body=JSON.parse(fs.readFileSync('onboarding-deployments-after.json','utf8'));
          if(body?.success!==true) throw new Error('deployment read failed');
          const source=Array.isArray(body.result?.deployments)?body.result.deployments:Array.isArray(body.result)?body.result:[];
          const deployments=source.map(x=>String(x.id||'')).filter(Boolean).sort();const versions=[...new Set(source.flatMap(x=>Array.isArray(x.versions)?x.versions.map(v=>String(v.version_id||'')):[]).filter(Boolean))].sort();
          const beforeD=String(process.env.ONBOARDING_PRODUCTION_DEPLOYMENTS||'').split(',').filter(Boolean).sort();const beforeV=String(process.env.ONBOARDING_PRODUCTION_VERSIONS||'').split(',').filter(Boolean).sort();
          if(JSON.stringify(deployments)!==JSON.stringify(beforeD)||JSON.stringify(versions)!==JSON.stringify(beforeV)) throw new Error('production deployment set changed during onboarding runtime');
          if(versions.includes(process.env.ONBOARDING_QA_PREVIEW_VERSION_ID||'')) throw new Error('Preview attached to production');
          console.log('ONBOARDING_POST_CLEANUP_PRODUCTION: PASS',JSON.stringify({previewAttached:false,productionVersions:versions}));
          NODE

      - name: Remove local ephemeral material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .onboarding-runtime-secrets.env ]; then shred -u .onboarding-runtime-secrets.env 2>/dev/null || rm -f .onboarding-runtime-secrets.env; fi
          rm -f onboarding-*.json onboarding-*.log onboarding-sensitive-findings.txt
          echo "ONBOARDING_EPHEMERAL_MATERIAL_CLEANUP: PASS"
