name: local-api

on:
  push:
    branches:
      - feat/saas-foundation
    paths:
      - 'apps/local-api/**'
      - 'packages/runtime/**'
      - 'packages/core/**'
      - 'packages/contracts/**'
      - 'scripts/check-provider-readiness.mjs'
      - '.env.example'
      - '.github/workflows/local-api.yml'
  pull_request:
    paths:
      - 'apps/local-api/**'
      - 'packages/runtime/**'
      - 'packages/core/**'
      - 'packages/contracts/**'
      - 'scripts/check-provider-readiness.mjs'
      - '.env.example'
      - '.github/workflows/local-api.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Typecheck runtime
        run: npm run typecheck --workspace=@socialpilot/runtime
      - name: Test runtime
        run: npm test --workspace=@socialpilot/runtime
      - name: Typecheck local API
        run: npm run typecheck --workspace=@socialpilot/local-api
      - name: Test local API
        run: npm test --workspace=@socialpilot/local-api
      - name: Provider readiness checker uses safe defaults
        run: APP_ENV=LOCAL npm run check-provider-readiness
      - name: Provider readiness checker blocks staging auto-publish
        run: |
          if APP_ENV=STAGING AUTO_PUBLISH=true npm run check-provider-readiness; then
            echo "Expected checker to block AUTO_PUBLISH outside PRODUCTION"
            exit 1
          fi
