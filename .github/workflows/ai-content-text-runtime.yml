name: AI Content Text Gating Runtime

on:
  workflow_dispatch:

concurrency:
  group: ai-content-text-gating-runtime
  cancel-in-progress: false

jobs:
  runtime:
    if: github.ref_name == 'verify/ai-content-text-gating-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - { name: Checkout, uses: actions/checkout@v4 }
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - { name: Install, run: "npm install --no-audit --no-fund" }

      - name: Pin certified production base
        shell: bash
        run: |
          set -euo pipefail
          expected="1377724860fb8cf210d5fb8c677d71fd3faa851b"
          base=$(git merge-base HEAD origin/main)
          if [ "$base" != "$expected" ]; then
            echo "RUNTIME_VERIFIER_NOT_CERTIFIED: production base mismatch" >&2
            exit 1
          fi

      - name: Static safety and product regressions
        run: |
          npm run typecheck
          npm run test:ai-text-gating
          npm run test:entitlements
          npm run test:entitlement-migration
          npm run test:tenant-security
          npm run test:tenant-cross-security
          npm run test:fase3-core
          node tests/ai-content-text-runtime-static.test.mjs
          npm run build
          npx wrangler deploy --dry-run

      - name: Generate ephemeral verifier material
        shell: bash
        run: |
          set -euo pipefail
          marker="${GITHUB_RUN_ID}"
          token=$(openssl rand -hex 32)
          alias="aitextqa-${GITHUB_RUN_ID}"
          echo "::add-mask::$token"
          echo "AI_TEXT_QA_MARKER=$marker" >> "$GITHUB_ENV"
          echo "AI_TEXT_QA_TOKEN_VALUE=$token" >> "$GITHUB_ENV"
          echo "AI_TEXT_PREVIEW_ALIAS=$alias" >> "$GITHUB_ENV"
          echo "AI_TEXT_PREVIEW_URL=https://${alias}-autoposter.02alessandrocaruso.workers.dev" >> "$GITHUB_ENV"
          printf 'AI_TEXT_QA_TOKEN=%s\n' "$token" > .ai-text-runtime-secrets.env
          chmod 600 .ai-text-runtime-secrets.env

      - name: Provider invocation counter instrumentation preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNTIME_VERIFIER_NOT_CERTIFIED: provider invocation counter harness not yet armed" >&2
          exit 1

      - name: Upload isolated Preview version
        if: ${{ false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --keep-vars --preview-alias "$AI_TEXT_PREVIEW_ALIAS" --secrets-file .ai-text-runtime-secrets.env

      - name: Verify Preview isolation from production
        if: ${{ false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/autoposter/deployments" -o ai-text-deployments-before.json

      - name: AI content text production-equivalent runtime
        if: ${{ false }}
        env:
          AI_TEXT_RUNTIME_VERIFIER_READY: "true"
        run: node tests/ai-content-text-runtime.mjs

      - name: Sensitive output scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIE '(sk-[A-Za-z0-9_-]{16,}|Bearer [A-Za-z0-9._-]{40,}|DATABASE_URL=.*://|AI_TEXT_QA_TOKEN=[A-Za-z0-9]{20,})' . --exclude-dir=.git --exclude='*.lock' >/tmp/ai-text-sensitive.txt 2>/dev/null; then
            echo "sensitive findings detected" >&2
            exit 1
          fi
          echo "sensitiveFindings=0"

      - name: Cleanup ephemeral verifier material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .ai-text-runtime-secrets.env ]; then
            chmod 600 .ai-text-runtime-secrets.env || true
            shred -u .ai-text-runtime-secrets.env 2>/dev/null || rm -f .ai-text-runtime-secrets.env
          fi
          rm -f ai-text-deployments-before.json ai-text-deployments-after.json /tmp/ai-text-sensitive.txt
          echo "AI_TEXT_VERIFIER_CLEANUP: PASS"
