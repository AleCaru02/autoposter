name: local-e2e

on:
  push:
    branches:
      - feat/saas-foundation
    paths:
      - 'apps/e2e/**'
      - 'apps/local-api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/local-e2e.yml'
  pull_request:
    paths:
      - 'apps/e2e/**'
      - 'apps/local-api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/local-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: supabase/setup-cli@v2
        with:
          version: 2.110.0
          github-token: ${{ github.token }}

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/e2e

      - name: Start and rebuild local Supabase
        run: |
          supabase start
          supabase db reset --local

      - name: Export local Supabase credentials
        shell: bash
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=TEST_SUPABASE_URL \
            --override-name auth.anon_key=TEST_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=TEST_SUPABASE_SERVICE_ROLE_KEY)"
          {
            echo "TEST_SUPABASE_URL=$TEST_SUPABASE_URL"
            echo "TEST_SUPABASE_PUBLISHABLE_KEY=$TEST_SUPABASE_PUBLISHABLE_KEY"
            echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$TEST_SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Start local E2E API
        shell: bash
        run: |
          LOCAL_E2E_ENABLED=true \
          LOCAL_SUPABASE_URL="$TEST_SUPABASE_URL" \
          LOCAL_SUPABASE_ANON_KEY="$TEST_SUPABASE_PUBLISHABLE_KEY" \
          LOCAL_SUPABASE_SERVICE_ROLE_KEY="$TEST_SUPABASE_SERVICE_ROLE_KEY" \
          LOCAL_API_HOST=127.0.0.1 \
          LOCAL_API_PORT=8787 \
          npm run dev --workspace=@socialpilot/local-api > /tmp/local-api.log 2>&1 &
          echo $! > /tmp/local-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/local-api.log
          exit 1

      - name: Start Vite web app
        shell: bash
        run: |
          VITE_LOCAL_API_URL=http://127.0.0.1:8787 \
          npm run dev --workspace=@socialpilot/web -- --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
          echo $! > /tmp/web.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/web.log
          exit 1

      - name: Verify dev servers before browser tests
        run: |
          curl -fsS http://127.0.0.1:8787/health
          curl -fsS http://127.0.0.1:5173 | grep -q '<div id="root"></div>'

      - name: Run API and browser E2E
        working-directory: apps/e2e
        env:
          E2E_API_URL: http://127.0.0.1:8787
          E2E_WEB_URL: http://127.0.0.1:5173
        run: npm test

      - name: Print service logs on failure
        if: failure()
        run: |
          echo '--- local api ---'
          cat /tmp/local-api.log || true
          echo '--- web ---'
          cat /tmp/web.log || true

      - name: Stop local services
        if: always()
        run: |
          if [ -f /tmp/web.pid ]; then kill "$(cat /tmp/web.pid)" || true; fi
          if [ -f /tmp/local-api.pid ]; then kill "$(cat /tmp/local-api.pid)" || true; fi
          supabase stop --no-backup || true
