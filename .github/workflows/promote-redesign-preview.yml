name: promote-exact-redesign-preview

on:
  push:
    branches:
      - feat/saas-foundation
    paths:
      - .github/workflows/promote-redesign-preview.yml

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact target and Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN repository secret is not configured"; exit 2; }
          echo "Project: prj_hNoKVPZkq2wuOWfQalGRc8KcXRKR"
          echo "Deployment: dpl_7J1ztuvg8pSkfgBDB47Yia6Qj1FV"
          echo "Expected source commit: 6a279baf712558cad64bd44adacfdbcd48a11840"

      - name: Verify deployment identity before promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          deployment='dpl_7J1ztuvg8pSkfgBDB47Yia6Qj1FV'
          team='team_M6fYd90idkyQEw1ba5tc8WwS'
          req=urllib.request.Request(
              f'https://api.vercel.com/v13/deployments/{deployment}?teamId={team}',
              headers={'Authorization': f"Bearer {os.environ['VERCEL_TOKEN']}"})
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          assert data.get('id') == deployment, data.get('id')
          assert data.get('projectId') == 'prj_hNoKVPZkq2wuOWfQalGRc8KcXRKR', data.get('projectId')
          assert data.get('name') == 'autoposter-redesign-preview', data.get('name')
          assert data.get('readyState') == 'READY', data.get('readyState')
          print('Exact deployment identity verified')
          PY

      - name: Promote only the verified deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          project='prj_hNoKVPZkq2wuOWfQalGRc8KcXRKR'
          deployment='dpl_7J1ztuvg8pSkfgBDB47Yia6Qj1FV'
          team='team_M6fYd90idkyQEw1ba5tc8WwS'
          req=urllib.request.Request(
              f'https://api.vercel.com/v10/projects/{project}/promote/{deployment}?teamId={team}',
              data=b'', method='POST',
              headers={'Authorization': f"Bearer {os.environ['VERCEL_TOKEN']}"})
          with urllib.request.urlopen(req, timeout=60) as r:
              print('promotion_status', r.status)
          PY

      - name: Verify stable alias no longer serves placeholder
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsSL --max-time 20 https://autoposter-redesign-preview.vercel.app/ || true)"
            if printf '%s' "$body" | grep -q 'Social Media Manager AI'; then
              echo 'Stable alias serves the redesigned app.'
              exit 0
            fi
            if printf '%s' "$body" | grep -q '<h1>Autoposter redesign preview</h1>'; then
              echo 'Alias propagation not complete yet.'
            fi
            sleep 10
          done
          echo 'Stable alias did not converge to the redesigned app.'
          exit 1
